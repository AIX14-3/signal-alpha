[project]
name = "signal-alpha"
version = "0.1.0"
description = "Signal Alpha monorepo workspace"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "psycopg2-binary>=2.9.0",
  "pytest>=8.0.0",
  "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/data-access",
  "packages/signal-core",
  "services/agent-worker",
  "services/main-server",
  "services/price-collector",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = [
  "E402",
]
