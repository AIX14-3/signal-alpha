[project]
name = "signal-alpha"
version = "0.1.0"
description = "Signal Alpha monorepo workspace"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/data-access",
  "packages/signal-core",
  "services/agent-worker",
  "services/main-server",
  "services/price-collector",
]
