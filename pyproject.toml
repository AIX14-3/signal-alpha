[project]
name = "signal-alpha"
version = "0.1.0"
description = "Signal Alpha monorepo workspace"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "psycopg2-binary>=2.9.0",
  "pytest>=8.0.0",
  "ruff>=0.14.0",
]
# 데이터 정합성 눈검증용 Streamlit 미니 대시보드(services/agent-worker/script/dashboard_validator.py).
# 런타임 서비스와 무관한 dev/ops 도구라 기본(dev) 그룹과 분리 — 설치: `uv sync --group dashboard`.
dashboard = [
  "streamlit>=1.40.0",
  "pandas>=2.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/data-access",
  "packages/market-data",
  "packages/signal-core",
  "services/agent-worker",
  "services/main-server",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = [
  "E402",
]
# 스크립트는 import 전에 sys.path/.env/logs 부트스트랩이 필요해 E402가 정상이다.
"*/script/*.py" = [
  "E402",
]
