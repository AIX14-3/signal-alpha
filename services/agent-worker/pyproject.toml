[project]
name = "signal-alpha-agent-worker"
version = "0.1.0"
description = "Internal FastAPI agent worker for Signal Alpha"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "boto3>=1.34.0",          # legacy s3_client.py
  "fastapi>=0.115.0",
  "google-cloud-storage>=2.18.0",  # report GCS storage adapter
  # price 수집 데몬(키움 REST)이 런타임에 사용 — dev extra로 내리면 --no-dev 컨테이너에서 ImportError
  "httpx>=0.27.0",
  # DataLab cause agent (app/agents/datalab/graph.py) StateGraph wiring. Only the
  # opt-in DATALAB_LLM_ENABLED path imports it (lazy, inside the registry factory).
  "langgraph>=0.2.0",
  "langchain-text-splitters>=0.2.0",  # parsers/chunker.py (RecursiveCharacterTextSplitter)
  "openai>=1.40.0",         # parsers/llm_parser.py
  "psycopg2-binary>=2.9.0",
  "pymupdf>=1.24.0",        # parsers/pdf_extractor.py (fitz)
  # ENRICH_HIRING: 채용 포스터 이미지 OCR(Tesseract). tesseract 바이너리 + kor/eng 데이터는
  # 런타임 이미지에서 제공(app/enrichment/tesseract_ocr.py). 미설치 시 enrich는 graceful skip.
  "pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "python-dotenv>=1.0.0",
  "selenium>=4.20.0",
  "signal-alpha-data-access",
  # vol-benchmark 변동성 모델 + DataContract (ML/DL 추론 단계, app/ml/).
  # ML 3종: ewma/har_rv(numpy, base) + garch(arch extra).
  # lightgbm 은 scikit-learn 까지 끌어와 이미지가 무거워져 제외(필요 시 [garch,lgbm]).
  # DL: tcn(경량)은 torch CPU 휠(~200MB+)이 무거워 기본 이미지에서 opt-in — 켜려면 [garch,dl].
  #     미포함 시 HAVE_TORCH=False 로 게이트에서 자동 skip(코드/게이트엔 이미 편입).
  # GPU 모델(kronos/chronos2)은 gpu extra 미포함 → 게이트에서 제외(CPU 호스트).
  "signal-alpha-vol-models[garch]",
  "sqlalchemy>=2.0.0",
  "webdriver-manager>=4.0.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
signal-alpha-data-access = { workspace = true }
signal-alpha-vol-models = { workspace = true }
