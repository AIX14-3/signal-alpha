[project]
name = "signal-alpha-agent-worker"
version = "0.1.0"
description = "Internal FastAPI agent worker for Signal Alpha"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  # report S3 파이프라인 런타임 의존 — 컨테이너는 `uv sync --package agent-worker`로 빌드되어
  # 루트 pyproject deps를 설치하지 않으므로 반드시 여기(서비스)에 선언해야 ImportError가 안 난다.
  "boto3>=1.34.0",          # s3_client.py
  "fastapi>=0.115.0",
  "langgraph>=0.2.0",
  # price 수집 데몬(키움 REST)이 런타임에 사용 — dev extra로 내리면 --no-dev 컨테이너에서 ImportError
  "httpx>=0.27.0",
  "langchain-text-splitters>=0.2.0",  # parsers/chunker.py (RecursiveCharacterTextSplitter)
  "openai>=1.40.0",         # parsers/llm_parser.py
  "psycopg2-binary>=2.9.0",
  "pymupdf>=1.24.0",        # parsers/pdf_extractor.py (fitz)
  "python-dotenv>=1.0.0",
  # report 임베딩(embed_report 태스크) — BGE-M3 in-process. torch 동반(~2-3GB).
  "sentence-transformers>=3.0.0",  # app/embeddings/provider.py
  "selenium>=4.20.0",
  "signal-alpha-data-access",
  "sqlalchemy>=2.0.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "webdriver-manager>=4.0.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "psycopg2-binary>=2.9.0",
  "sqlalchemy>=2.0.0"
]
# Model bake-off harness (app/ml). NOT installed in the runtime container — the
# harness is a research/offline tool. Install with: uv sync --extra ml
ml = [
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "scipy>=1.11"
]
# Optional gradient-boosting libraries; the registry auto-detects and skips any
# that are absent, so these are additive on top of the `ml` extra.
ml-boost = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2"
]
# Offline backfill tooling (scripts/). FinanceDataReader pulls historical Korean
# daily OHLCV + indices with no API key; asyncpg is the DataLab backfill's driver.
backfill = [
  "finance-datareader>=0.9.50",
  "asyncpg>=0.29"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
signal-alpha-data-access = { workspace = true }
