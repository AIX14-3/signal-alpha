[project]
name = "signal-alpha-agent-worker"
version = "0.1.0"
description = "Internal FastAPI agent worker for Signal Alpha"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "psycopg2-binary>=2.9.0",
  "python-dotenv>=1.0.0",
  "selenium>=4.20.0",
  "signal-alpha-data-access",
  "sqlalchemy>=2.0.0",
  "webdriver-manager>=4.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "psycopg2-binary>=2.9.0",
  "sqlalchemy>=2.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
signal-alpha-data-access = { workspace = true }
