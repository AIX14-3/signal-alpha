[project]
name = "signal-alpha-price-collector"
version = "0.2.0"
description = "Kiwoom REST API polling collector for Signal Alpha (Linux/Docker compatible)"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "signal-alpha-data-access",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
signal-alpha-data-access = { workspace = true }
