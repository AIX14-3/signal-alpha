[project]
name = "signal-alpha-main-server"
version = "0.1.0"
description = "User-facing FastAPI main server for Signal Alpha"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  # PortOne V2 REST 호출(본인인증·결제 검증·환불 취소)에 런타임 필수.
  # real 모드 단일화로 더 이상 dev 전용이 아니다 → 핵심 의존성(컨테이너 --no-dev 에도 포함).
  "httpx>=0.27.0",
  "signal-alpha-data-access",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
signal-alpha-data-access = { workspace = true }
