  function renderSparkline(vals, up) {
    const max = Math.max(...vals, 1), min = Math.min(...vals);
    const range = max - min || 1;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * 100},${100 - ((v - min) / range) * 80}`).join(' ');
    const stroke = up ? '#22c55e' : '#ef4444';
    return `<svg viewBox="0 0 100 100" class="w-14 h-8" preserveAspectRatio="none"><polyline fill="none" stroke="${stroke}" stroke-width="3" points="${pts}"/></svg>`;
  }

  function renderPriceChart(points) {
    const w = 600, h = 200, pad = 12;
    const min = Math.min(...points) * 0.998, max = Math.max(...points) * 1.002;
    const range = max - min || 1;
    const coords = points.map((p, i) => {
      const x = pad + (i / (points.length - 1)) * (w - pad * 2);
      const y = h - pad - ((p - min) / range) * (h - pad * 2);
      return [x, y];
    });
    const line = coords.map(c => c.join(',')).join(' ');
    const area = `${coords[0][0]},${h} ${line} ${coords[coords.length - 1][0]},${h}`;
    return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-48"><defs><linearGradient id="quoteGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs><polygon class="quote-chart-area" points="${area}"/><polyline class="quote-chart-line" points="${line}"/></svg>`;

  }

    const stock = state.selectedStock;

    const hitl = stock.score < 60;
    const agentCard = (key, icon, title, score, desc) => `<div data-action="drilldown" data-key="${key}" class="card-light rounded-xl p-5 cursor-pointer hover:border-orange-400 flex justify-between group shadow-sm">
      <div><div class="flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4 text-orange-500"></i><span class="font-bold text-neutral-900 group-hover:text-orange-600">${title}</span><span class="text-[10px] px-2 py-0.5 rounded border ${dirChip(score>=70?'POSITIVE':'MIXED')}">${score}점</span></div><p class="text-xs text-neutral-500 mt-2">${desc}</p></div>

    return `<div class="max-w-7xl mx-auto py-10 px-4 space-y-8 animate-fade-in">

        <div class="flex gap-2"><button data-action="save-journal" class="btn-orange px-4 py-2 rounded-full text-xs font-bold">저널 저장</button><button data-action="reanalyze" class="btn-outline px-4 py-2 rounded-full text-xs font-bold">재분석</button></div>

        <div class="lg:col-span-5">
          <div class="card-orange rounded-2xl p-8">
            <span class="text-xs text-white/80 font-mono uppercase">종합 신뢰도</span>

            <div class="h-2 bg-black/20 rounded-full"><div class="h-full bg-white rounded-full" style="width:${stock.score}%"></div></div>
            ${stock.score>=70?`<p class="text-sm font-bold mt-4 flex items-center gap-1"><i data-lucide="trending-up" class="w-4 h-4"></i> +${pct}% vs 컨센서스</p>`:''}
            <p class="text-xs text-white/85 mt-4 leading-relaxed border-t border-white/20 pt-4">"${esc(stock.summary)}"</p>
          </div>

    const q = stock.quote;
    const up = q.change >= 0;
    const chgCls = up ? 'text-green-600' : 'text-red-600';
    const periods = ['1D', '1W', '1M', '6M', 'YTD', '1Y', '5Y'];
    const periodBtns = periods.map(p => `<button data-action="quote-period" data-period="${p}" class="px-3 py-1 text-xs rounded-lg border ${state.quotePeriod===p?'period-tab-active':'border-neutral-200 text-neutral-500'}">${p}</button>`).join('');
    const stockChips = STORY_ITEMS.map(s => `<button data-action="quote-stock" data-code="${s.code}" class="px-3 py-1.5 rounded-full text-xs font-bold border ${state.quoteCode===s.code?'card-orange border-transparent text-white':'btn-outline'}">${esc(s.name)}</button>`).join('');
    const kpi = (label, val, sub) => `<div class="card-light rounded-xl p-4 shadow-sm"><span class="text-[10px] text-neutral-500 uppercase">${label}</span><p class="text-lg font-black text-neutral-900 mt-1">${val}</p>${sub?`<p class="text-[10px] text-neutral-500 mt-1">${sub}</p>`:''}</div>`;
    const infoCell = (l, v) => `<div class="p-3 border border-neutral-100 rounded-lg"><span class="text-[10px] text-neutral-500 block">${l}</span><span class="text-sm font-bold text-neutral-900">${v}</span></div>`;
    const indices = MARKET_INDICES.map(m => `<div class="card-light rounded-xl p-4 shadow-sm min-w-[140px] flex-1">
      <span class="text-[10px] font-bold text-neutral-500">${m.name}</span>
      <p class="text-sm font-black mt-1">${m.value}</p>
      <p class="text-xs font-bold ${m.up?'text-green-600':'text-red-600'}">${m.up?'+':''}${m.chg}%</p>
      ${renderSparkline(m.spark, m.up)}
    </div>`).join('');
    const signalScore = stock.score;
    const srcRows = [
      { l: 'DART 공시', s: stock.dart.score },
      { l: 'Report RAG', s: stock.report.score },
      { l: 'Alternative', s: stock.alt.score },
      { l: '소스 일치성', s: stock.consistency },
    ].map(r => `<div class="flex justify-between text-sm py-2 border-b border-neutral-100 last:border-0"><span class="text-neutral-600">${r.l}</span><span class="font-bold">${typeof r.s==='number'?r.s+'점':r.s}</span></div>`).join('');

    return `<div class="max-w-7xl mx-auto py-8 px-4 md:px-6 space-y-6 animate-fade-in">
      <div class="card-light rounded-2xl p-6 md:p-8 shadow-sm">
        <div class="flex flex-wrap justify-between gap-6">
          <div class="flex-1 min-w-[280px]">
            <div class="flex flex-wrap gap-2 mb-4">${stockChips}</div>
            <h1 class="text-2xl md:text-3xl font-black text-neutral-900">${esc(stock.name)}</h1>
            <p class="text-xs text-neutral-500 mt-1">KRX · ${stock.code} · ${esc(q.nameEn)}</p>
            <div class="flex flex-wrap items-baseline gap-3 mt-4">
              <span class="text-3xl md:text-4xl font-black">${fmtWon(q.price)}<span class="text-lg text-neutral-500 font-normal">원</span></span>
              <span class="${chgCls} font-bold text-lg">${up?'+':''}${fmtWon(q.change)}원 (${up?'+':''}${q.changePct}%)</span>
            </div>
            <p class="text-[10px] text-neutral-400 mt-3">${esc(q.asOf)} · 목업 시세(2026-06-02 KRX 종가 기준) · DART · 리포트 · Alt</p>
          </div>
          <div class="flex flex-col items-end gap-3">
            <span class="text-xs font-bold px-4 py-2 rounded-full border ${dirChip(stock.direction)}">${stock.direction}</span>
            <div class="flex flex-wrap gap-2 justify-end">
              <button class="btn-outline px-4 py-2 rounded-full text-xs font-bold">관심 종목 추가</button>
              ${state.selectedStock?`<button data-action="nav-page" data-page="main" class="btn-outline px-4 py-2 rounded-full text-xs font-bold">근거 데이터 보기</button>`:`<button data-action="select-stock" data-code="${stock.code}" class="btn-outline px-4 py-2 rounded-full text-xs font-bold">시그널 분석</button>`}
              <button data-action="save-journal-quote" class="btn-orange px-4 py-2 rounded-full text-xs font-bold">내 판단 기록하기</button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        ${kpi('현재가', fmtWon(q.price)+' KRW', '실시간')}
        ${kpi('전일 대비', `${up?'+':''}${fmtWon(q.change)} (${up?'+':''}${q.changePct}%)`, up?'Up':'Down')}
        ${kpi('Signal Score', signalScore+' / 100', 'Positive bias')}
        ${kpi('Confidence', stock.consistency, 'Evidence reliability')}
        ${kpi('데이터 방향 일치도', q.sourcesAgree, '소스 동의')}
      </div>

      <div class="grid lg:grid-cols-12 gap-6">
        <div class="lg:col-span-8 space-y-4">
          <div class="card-light rounded-2xl p-5 shadow-sm">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
              <h2 class="font-bold text-neutral-900">${esc(stock.name)} 가격 흐름</h2>
              <div class="flex flex-wrap gap-1">${periodBtns}</div>
            </div>
            ${renderPriceChart(q.intraday)}
            <div class="flex justify-between text-[10px] text-neutral-400 mt-2 px-2"><span>09:00</span><span>12:00</span><span>15:30</span></div>
          </div>
          <div class="card-light rounded-2xl p-5 shadow-sm">
            <h3 class="text-sm font-bold text-neutral-900 mb-3">종목 정보</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              ${infoCell('시가', fmtWon(q.open))}
              ${infoCell('고가', fmtWon(q.high))}
              ${infoCell('저가', fmtWon(q.low))}
              ${infoCell('거래량', q.volume)}
              ${infoCell('시가총액', q.marketCap)}
              ${infoCell('52주 최고', fmtWon(q.week52High))}
              ${infoCell('52주 최저', fmtWon(q.week52Low))}
              ${infoCell('PER', q.per)}
            </div>
          </div>
        </div>
        <div class="lg:col-span-4">
          <div class="card-light rounded-2xl p-6 shadow-sm sticky top-24">
            <h3 class="font-bold text-neutral-900">근거 기반 종합 신호</h3>
            <p class="text-[10px] text-neutral-500 mt-1">Composite Signal · Mock</p>
            <div class="flex justify-center my-6">
              <div class="relative w-40 h-40 rounded-full donut-ring flex items-center justify-center" style="--pct: ${signalScore}%">
                <div class="w-28 h-28 rounded-full bg-white flex flex-col items-center justify-center shadow-inner">
                  <span class="text-3xl font-black text-blue-600">${signalScore}</span>
                  <span class="text-[10px] text-neutral-500">Signal Score</span>
                </div>
              </div>
            </div>
            <div class="mb-4">${srcRows}</div>
            <p class="text-xs text-neutral-600 leading-relaxed border-t border-neutral-100 pt-4">${esc(stock.summary)}</p>
            <p class="text-[10px] text-neutral-400 mt-3">※ 투자 권유가 아닌 정보 제공 목적입니다.</p>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 overflow-x-auto pb-2">${indices}</div>
    </div>`;
  }

  function renderDrawer() {
    if (!state.activeDrilldown || !state.selectedStock) return '';
    const stock = state.selectedStock;
    const label = DRILLDOWN_LABELS[state.activeDrilldown] || '상세';
    return `<div class="fixed inset-0 z-50 flex justify-end"><div data-action="close-drawer" class="absolute inset-0 bg-neutral-900/30 backdrop-blur-sm"></div>
      <div class="relative w-full max-w-lg bg-white border-l border-neutral-200 h-full overflow-y-auto p-6 shadow-2xl">
        <div class="flex justify-between items-start mb-2">
          <div><p class="text-xs font-bold text-orange-600 uppercase">${esc(label)}</p><h3 class="text-xl font-black text-neutral-900">${esc(stock.name)}</h3></div>
          <button data-action="close-drawer" class="p-2 rounded-full border border-neutral-200 text-neutral-600 hover:border-orange-400"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="mt-6">${renderDrilldownContent(state.activeDrilldown, stock)}</div>
      </div></div>`;
  }

  function renderJournal() {
    const ratio = getPatternRatio();
    const notTrade = 100 - ratio;
    const alerts = MOCK_ALERTS.map(a => `<div class="flex gap-3 p-3 rounded-lg ${a.read?'bg-neutral-50':'bg-orange-50 border border-orange-100'}">
      <div class="flex-1"><p class="text-sm font-semibold text-neutral-900">${esc(a.name)}</p><p class="text-xs text-neutral-600">${esc(a.msg)}</p><span class="text-[10px] text-neutral-400">${esc(a.time)}</span></div>
      ${!a.read?'<span class="w-2 h-2 rounded-full bg-orange-500 shrink-0 mt-2"></span>':''}</div>`).join('');
    const list = state.journal.map(item => `<div class="card-light rounded-xl p-6 flex flex-col md:flex-row gap-6 shadow-sm">
      <div class="flex-1"><h4 class="font-bold text-neutral-900">${esc(item.name)}</h4><span class="text-xs text-neutral-500">${item.code} · ${item.date}</span>
        <textarea data-action="journal-note" data-id="${item.id}" class="w-full mt-3 bg-neutral-50 border border-neutral-200 rounded-lg p-3 text-xs text-neutral-700 h-16 resize-none">${esc(item.note)}</textarea></div>
      <div class="md:w-44 flex flex-col items-end gap-3"><span class="text-2xl font-black text-orange-600">${item.score}</span>
        <button data-action="toggle-trade" data-id="${item.id}" class="w-full py-2 rounded-full text-xs font-bold border ${item.trade?'card-orange border-transparent text-white':'border-neutral-300 text-neutral-600'}">${item.trade?'매매 진입':'관망'}</button></div></div>`).join('');
    return `<div class="max-w-5xl mx-auto py-12 px-4 space-y-10">
      <div class="flex justify-between items-center border-b border-neutral-200 pb-6">
        <div class="flex items-center gap-3"><button data-action="nav-page" data-page="home" class="p-2 rounded-full border border-neutral-300 text-neutral-700"><i data-lucide="arrow-left" class="w-4 h-4"></i></button><h2 class="text-2xl font-black text-neutral-900">Signal Journal</h2></div>
        <button data-action="nav-page" data-page="home" data-focus-search="1" class="btn-orange px-5 py-2 rounded-full text-xs font-bold">+ 새 분석</button>
      </div>
      <div class="grid md:grid-cols-3 gap-4">
        <div class="card-white rounded-xl p-6 text-neutral-900 shadow-sm"><span class="text-xs text-neutral-500">누적</span><div class="text-4xl font-black mt-1">${state.journal.length}</div></div>
        <div class="card-orange rounded-xl p-6"><span class="text-xs text-white/80">투자 연계</span><div class="text-4xl font-black mt-1">${ratio}%</div></div>
        <div class="card-light rounded-xl p-6 shadow-sm"><span class="text-xs text-neutral-500">급변 알림</span><div class="text-orange-600 font-bold mt-1">±15점 ACTIVE</div></div>
      </div>
      <div class="grid md:grid-cols-2 gap-6">
        <div class="card-light rounded-xl p-5 shadow-sm"><h3 class="text-sm font-bold mb-3">±15점 급변 알림</h3><div class="space-y-2">${alerts}</div></div>
        <div class="card-light rounded-xl p-5 shadow-sm"><h3 class="text-sm font-bold mb-3">패턴 인사이트</h3>
          <p class="text-xs text-neutral-600 mb-4">긍정 시그널(70점+) 중 실제 매매 비율 <strong class="text-orange-600">${ratio}%</strong></p>
          <div class="h-8 flex rounded-full overflow-hidden text-[10px] font-bold text-white">
            <div class="bg-orange-500 flex items-center justify-center" style="width:${ratio}%">매매 ${ratio}%</div>
            <div class="bg-neutral-200 text-neutral-600 flex items-center justify-center flex-1">관망 ${notTrade}%</div>
          </div>
          <p class="text-[10px] text-neutral-500 mt-3">"이 시그널을 봤을 때 나는 어떤 판단을 했는가" — 자기 검열</p>
        </div>
      </div>
      <div><h3 class="text-sm font-bold text-neutral-900 mb-4">판단 기록</h3>${list}</div>
    </div>`;
  }

  function renderHeader() {
    const inFlow = state.currentPage === 'running' || state.currentPage === 'main';
    const navHtml = NAV_ITEMS.map(n => {
      const active = state.currentPage === n.pageId;
      return `<button data-action="nav-page" data-page="${n.pageId}" class="text-sm transition-colors ${active?'nav-active':'text-neutral-600 hover:text-orange-600'}">${n.label}</button>`;
    }).join('<span class="text-neutral-300 mx-1 hidden md:inline">·</span>');
    const flowBadge = inFlow ? '<span class="text-[10px] font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded-full hidden sm:inline">분석 중</span>' : '';
    return `<header class="sticky top-0 z-40 header-solid">
      <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between gap-4">
        <div data-action="nav-page" data-page="home" class="cursor-pointer shrink-0">${renderBrandLogo('header')}</div>
        <nav class="hidden lg:flex items-center gap-1 flex-1 justify-center">${navHtml}</nav>
        <div class="flex items-center gap-3 text-sm shrink-0">
          ${flowBadge}
          <button data-action="nav-page" data-page="home" data-focus-search="1" class="text-neutral-500 hover:text-orange-600 hidden sm:inline"><i data-lucide="search" class="w-4 h-4"></i></button>
          <button data-action="nav-page" data-page="home" data-focus-search="1" class="btn-orange px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">무료 시작</button>
        </div>
      </div>
      <nav class="lg:hidden flex flex-wrap justify-center gap-x-2 gap-y-1 px-4 pb-3 border-t border-neutral-100 text-xs">
        ${NAV_ITEMS.map(n => `<button data-action="nav-page" data-page="${n.pageId}" class="px-2 py-1 ${state.currentPage===n.pageId?'text-orange-600 font-bold':'text-neutral-600'}">${n.label}</button>`).join('')}
      </nav>
    </header>`;
  }

  function renderFooter() {
    return `<footer class="bg-white text-neutral-500 border-t border-neutral-200">
      <div class="max-w-7xl mx-auto px-4 md:px-8 py-14 grid md:grid-cols-2 gap-10">
        <div><span class="text-lg font-black text-neutral-900">Signal <span class="text-orange-600">α</span></span>
          <p class="text-xs mt-4 leading-relaxed">서울 · Team LENS<br/>본 정보는 투자 권유가 아닙니다.</p></div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 text-xs">
          <div><b class="text-neutral-900 block mb-2">서비스</b><a href="#features" data-action="nav-page" data-page="features" class="block py-0.5 hover:text-orange-600">소개</a><a href="#agents" data-action="nav-page" data-page="agents" class="block py-0.5 hover:text-orange-600">에이전트</a></div>
          <div><b class="text-neutral-900 block mb-2">데이터</b><a href="#" class="block py-0.5 hover:text-orange-600">DART</a><a href="#" class="block py-0.5 hover:text-orange-600">RAG</a></div>
          <div><b class="text-neutral-900 block mb-2">IR</b><a href="#" class="block py-0.5 hover:text-orange-600">공시</a></div>
          <div><b class="text-neutral-900 block mb-2">고객센터</b><a href="#" class="block py-0.5 hover:text-orange-600">문의</a></div>
        </div>
      </div>
      <div class="text-center text-[10px] py-4 border-t border-neutral-100">© 2026 Signal α · Team LENS</div>
    </footer>`;
  }

  function updateTopBtn() {
    const btn = document.getElementById('btn-top');
    if (!btn) return;
    const show = window.scrollY > 400;
    btn.classList.toggle('opacity-0', !show);
    btn.classList.toggle('pointer-events-none', !show);
  }

  function render() {
    let main = '';
    if (state.currentPage === 'home') main = renderHome();
    else if (state.currentPage === 'features') main = renderFeatures();
    else if (state.currentPage === 'agents') main = renderAgents();
    else if (state.currentPage === 'stories') main = renderStories();
    else if (state.currentPage === 'journal') main = renderJournal();
    else if (state.currentPage === 'quote') main = renderQuote();
    else if (state.currentPage === 'running') main = renderRunning();
    else if (state.currentPage === 'main') main = renderMain();

    const wrapHome = state.currentPage === 'home';
    document.getElementById('app').innerHTML = `
      <div class="min-h-screen flex flex-col ${wrapHome?'bg-white':'bg-neutral-50 pt-0'}">
        ${renderHeader()}
        <main class="flex-1 ${wrapHome ? 'p-0' : 'py-6'}">${main}</main>
        ${renderFooter()}
        ${renderDrawer()}
      </div>`;
    if (typeof lucide !== 'undefined') lucide.createIcons();
    updateTopBtn();
    const end = document.getElementById('terminal-end');
    if (end) end.scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('app').addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (a === 'nav-page') navigateTo(el.dataset.page, el.dataset.focusSearch === '1');
    else if (a === 'select-stock') handleSelectStock(el.dataset.code);
    else if (a === 'go-main') { state.currentPage = 'main'; location.hash = 'main'; render(); window.scrollTo({top:0}); }
    else if (a === 'go-quote') { if (state.selectedStock) state.quoteCode = state.selectedStock.code; state.currentPage = 'quote'; location.hash = 'quote'; render(); window.scrollTo({top:0}); }
    else if (a === 'quote-stock' || a === 'nav-quote') { state.quoteCode = el.dataset.code; state.currentPage = 'quote'; location.hash = 'quote'; render(); window.scrollTo({top:0}); }
    else if (a === 'quote-period') { state.quotePeriod = el.dataset.period; render(); }
    else if (a === 'save-journal-quote') {
      state.selectedStock = getQuoteContext();
      saveToJournal();
    }
    else if (a === 'save-journal') saveToJournal();
    else if (a === 'reanalyze' && state.selectedStock) startAnalysisSimulation(state.selectedStock);
    else if (a === 'drilldown') { state.activeDrilldown = el.dataset.key; render(); }
    else if (a === 'close-drawer') { state.activeDrilldown = null; render(); }
    else if (a === 'agent-tab') { state.activeAgentTab = el.dataset.tab; render(); }
    else if (a === 'agent-analyze') { state.showAgentPicker = true; render(); }
    else if (a === 'close-picker') { state.showAgentPicker = false; render(); }
    else if (a === 'story-filter') { state.storyFilter = el.dataset.filter; location.hash = 'stories?filter=' + el.dataset.filter; render(); }
    else if (a === 'toggle-trade') { const id = Number(el.dataset.id); state.journal = state.journal.map(i => i.id === id ? {...i, trade: !i.trade} : i); render(); }
    else if (a === 'scroll-top') window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('app').addEventListener('focusin', e => { if (e.target.id === 'search-input') { state.showAutocomplete = true; render(); } });
  document.getElementById('app').addEventListener('submit', e => {
    if (e.target.id !== 'search-form') return;
    e.preventDefault();
    const q = document.getElementById('search-input')?.value?.trim();
    if (!q) return;
    let code = '000660';
    if (q.includes('삼성') || q.includes('005930')) code = '005930';
    else if (q.includes('네이버') || q.toLowerCase().includes('naver') || q.includes('035420')) code = '035420';
    handleSelectStock(code);
  });
  document.getElementById('app').addEventListener('input', e => {
    if (e.target.id === 'search-input') state.searchQuery = e.target.value;
    if (e.target.dataset.action === 'journal-note') {
      const id = Number(e.target.dataset.id);
      state.journal = state.journal.map(i => i.id === id ? {...i, note: e.target.value} : i);
    }
  });
  document.addEventListener('click', e => { if (!e.target.closest('#search-form') && state.showAutocomplete) { state.showAutocomplete = false; render(); } });
  window.addEventListener('scroll', updateTopBtn);
  window.addEventListener('beforeunload', clearSimTimers);
  window.addEventListener('hashchange', () => {
    const raw = (location.hash || '#home').slice(1);
    const page = raw.split('?')[0] || 'home';
    if (raw.includes('filter=')) state.storyFilter = raw.split('filter=')[1] || 'all';
    if (['home','features','agents','stories','journal','quote','running','main'].includes(page) && page !== state.currentPage) {
      if (INFO_PAGES.includes(page)) navigateTo(page);
      else if (page === 'running' || page === 'main') state.currentPage = page;
      render();
    }
  });
  (function initFromHash() {
    const raw = (location.hash || '#home').slice(1);
    const page = raw.split('?')[0] || 'home';
    if (raw.includes('filter=')) state.storyFilter = raw.split('filter=')[1] || 'all';
    if (INFO_PAGES.includes(page)) state.currentPage = page;
  })();
  render();
})();
  </script>
</body>
</html>
