<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal α — 홈 (목업)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===== Signal α design tokens (README3.md §2) ===== */
  :root{
    --brand-600:#ea580c; --brand-500:#f97316; --brand-400:#fb923c; --brand-50:#fff7ed;
    --n900:#171717; --n700:#404040; --n500:#737373; --n400:#a3a3a3;
    --n200:#e5e5e5; --n100:#f5f5f5; --bg:#fafafa; --white:#ffffff;
    --up:#dc2626; --up-bg:#fef2f2; --down:#2563eb; --down-bg:#eff6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Inter','Noto Sans KR',sans-serif;
    background:#e8eaed;display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:24px;color:var(--n900);
  }

  /* ===== Phone frame (max-w 412 · border-10 · radius-42) ===== */
  .phone{
    width:412px;height:880px;background:#0a0a0a;border-radius:48px;
    padding:11px;box-shadow:0 30px 70px rgba(0,0,0,.35);position:relative;
  }
  .screen{
    width:100%;height:100%;background:var(--bg);border-radius:38px;
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }

  /* ===== Status bar ===== */
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 26px 6px;font-size:14px;font-weight:600;color:var(--n900);
  }
  .statusbar .icons{display:flex;align-items:center;gap:6px;}
  .statusbar svg{display:block;}

  /* ===== Scroll body ===== */
  .body{flex:1;overflow-y:auto;padding:6px 22px 0;}
  .body::-webkit-scrollbar{display:none;}

  .topnotice{text-align:right;font-size:12px;color:var(--n400);font-weight:500;margin-bottom:18px;}

  /* ===== Hero ===== */
  .hero{font-size:30px;line-height:1.28;font-weight:900;letter-spacing:-.02em;color:var(--n900);margin-bottom:22px;}
  .hero .accent{color:var(--brand-600);}

  /* ===== Search box (rotating popular keyword) ===== */
  .searchbox{
    display:flex;align-items:center;gap:12px;background:var(--white);
    border:1.5px solid #fed7aa;border-radius:18px;padding:20px 20px;
    box-shadow:0 4px 16px rgba(234,88,12,.10);cursor:text;transition:border-color .2s;
  }
  .searchbox:hover{border-color:var(--brand-500);}
  .searchbox .mag{flex-shrink:0;color:var(--brand-500);}
  .search-text{font-size:21px;font-weight:700;color:var(--n400);position:relative;flex:1;}
  .search-text .word{transition:opacity .35s ease,transform .35s ease;display:inline-block;}
  .search-text .word.swap{opacity:0;transform:translateY(-6px);}
  .search-text .caret{
    display:inline-block;width:2px;height:22px;background:var(--brand-500);
    margin-left:3px;vertical-align:-3px;animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .search-go{
    flex-shrink:0;background:var(--brand-600);color:#fff;border:none;border-radius:12px;
    padding:9px 13px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  }

  /* ===== Hot banner (was: 단순변심 무료환불) ===== */
  .hotbar{
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,var(--brand-600),var(--brand-500) 60%,var(--brand-400));
    color:#fff;border-radius:14px;padding:15px 18px;margin:18px 0 14px;
    box-shadow:0 8px 20px rgba(234,88,12,.28);
  }
  .hotbar .left{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;}
  .hotbar .live{
    display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);
    color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;
  }
  .hotbar .live .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hotbar .right{display:flex;align-items:center;gap:4px;font-size:13px;color:rgba(255,255,255,.92);font-weight:600;}

  /* ===== Ranking card ===== */
  .rankcard{background:var(--white);border:1px solid var(--n200);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.04);overflow:hidden;}
  .rankhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px;}
  .rankhead .t{font-size:13px;font-weight:700;color:var(--n700);}
  .rankhead .ts{font-size:11px;color:var(--n400);font-weight:500;}

  .row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--n100);cursor:pointer;transition:background .15s;}
  .row:hover{background:var(--brand-50);}
  .row .rank{width:20px;text-align:center;font-size:16px;font-weight:900;font-family:'Inter';flex-shrink:0;}
  .row .rank.top{color:var(--brand-600);}
  .row .rank.norm{color:var(--n400);}
  .row .delta{font-size:10px;font-weight:700;text-align:center;margin-top:2px;}
  .row .info{flex:1;min-width:0;}
  .row .nm{font-size:15px;font-weight:700;color:var(--n900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .code{font-family:'Inter';font-size:11px;color:var(--n400);font-weight:500;letter-spacing:.02em;}
  .row .spark{flex-shrink:0;width:56px;height:26px;}
  .row .px{text-align:right;flex-shrink:0;min-width:74px;}
  .row .price{font-size:14px;font-weight:700;font-family:'Inter';color:var(--n900);}
  .row .chg{font-size:12px;font-weight:700;font-family:'Inter';}
  .up{color:var(--up);} .down{color:var(--down);}
  .new-badge{display:inline-block;background:var(--brand-50);color:var(--brand-600);font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;}
  .flat{color:var(--n400);}
  .divider-5{border-top:6px solid var(--n100);}

  .footnote{font-size:11px;color:var(--n400);text-align:center;margin:18px 0 14px;line-height:1.5;}

  /* ===== Bottom nav ===== */
  .bottomnav{display:flex;justify-content:space-around;align-items:center;background:var(--white);border-top:1px solid var(--n200);padding:10px 8px 22px;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--n400);flex:1;cursor:pointer;}
  .tab.active{color:var(--brand-600);}
  .tab svg{display:block;}
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">

      <!-- Status bar -->
      <div class="statusbar">
        <span>1:20</span>
        <div class="icons">
          <!-- signal -->
          <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#171717"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1" opacity=".35"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></g></svg>
          <!-- wifi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5l1.6-2c-.9-.7-2.3-.7-3.2 0L8 10.5z" fill="#171717"/><path d="M3.2 5.6c2.7-2.3 6.9-2.3 9.6 0M5.3 8c1.6-1.3 3.8-1.3 5.4 0" stroke="#171717" stroke-width="1.4" stroke-linecap="round"/></svg>
          <!-- battery -->
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="22" height="11" rx="3" fill="none" stroke="#171717" stroke-opacity=".4"/><rect x="3" y="3" width="17" height="7" rx="1.5" fill="#171717"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#171717" fill-opacity=".4"/></svg>
        </div>
      </div>

      <!-- Scrollable content -->
      <div class="body">
        <div class="topnotice">이용안내</div>

        <!-- Hero (was: 먼저, 내 차 시세를 알아볼까요?) -->
        <h1 class="hero">주식에 대한<br /><span class="accent">정보</span>를 알아볼까요?</h1>

        <!-- Search box: rotating popular keywords -->
        <div class="searchbox" id="searchbox">
          <svg class="mag" width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <div class="search-text"><span class="word" id="rotword">삼성전자</span><span class="caret"></span></div>
          <button class="search-go">검색</button>
        </div>

        <!-- Hot banner (was: 단순변심도 무료환불 · 2,421대 보기) -->
        <div class="hotbar">
          <div class="left">
            <span>🔥 지금 뜨는 종목</span>
            <span class="live"><span class="dot"></span>실시간</span>
          </div>
          <div class="right">TOP 10
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>

        <!-- Ranking card (1~10) -->
        <div class="rankcard">
          <div class="rankhead">
            <span class="t">인기 검색어 순위</span>
            <span class="ts">09:31 기준</span>
          </div>
          <div id="ranklist"><!-- rows injected by JS --></div>
        </div>

        <p class="footnote">※ 투자 권유가 아닌 정보 제공 목적입니다.<br />표시된 순위·시세는 데모용 목업 데이터입니다.</p>
      </div>

      <!-- Bottom nav (was: 내차팔기 / 내차사기 / 이력조회 / 전체) -->
      <div class="bottomnav">
        <div class="tab active">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          홈
        </div>
        <div class="tab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 19V5M4 19h16M7 16l3-4 3 2 4-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          시세
        </div>
        <div class="tab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.1 4.9L19 9l-3.6 3.3.9 5.1L12 15l-4.3 2.4.9-5.1L5 9l4.9-1.1L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          분석
        </div>
        <div class="tab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 4h11a2 2 0 012 2v14H8a2 2 0 01-2-2V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 4a2 2 0 00-2 2v12" stroke="currentColor" stroke-width="1.8"/></svg>
          저널
        </div>
      </div>

    </div>
  </div>

<script>
  /* ===== Mock data: 실시간 인기 검색어 TOP 10 ===== */
  const stocks = [
    {rank:1,  name:'삼성전자',        code:'005930', price:'73,400',  chg: 1.24, delta:'▲2'},
    {rank:2,  name:'SK하이닉스',      code:'000660', price:'198,500', chg: 3.41, delta:'▲1'},
    {rank:3,  name:'NAVER',          code:'035420', price:'215,000', chg:-0.83, delta:'▼1'},
    {rank:4,  name:'현대차',          code:'005380', price:'248,000', chg: 0.51, delta:'—'},
    {rank:5,  name:'카카오',          code:'035720', price:'41,250',  chg: 2.11, delta:'▲3'},
    {rank:6,  name:'LG에너지솔루션',  code:'373220', price:'389,000', chg:-1.52, delta:'▼2'},
    {rank:7,  name:'기아',            code:'000270', price:'112,300', chg: 0.94, delta:'NEW'},
    {rank:8,  name:'셀트리온',        code:'068270', price:'178,400', chg: 0.28, delta:'▲1'},
    {rank:9,  name:'POSCO홀딩스',     code:'005490', price:'421,000', chg:-2.23, delta:'▼3'},
    {rank:10, name:'삼성바이오로직스', code:'207940', price:'982,000', chg: 1.83, delta:'▲2'},
  ];

  /* seeded PRNG so the sparklines look natural but stay consistent */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  /* build a gentle random-walk sparkline that ends in the change's direction */
  function sparkline(seed, up){
    const rnd = mulberry32(seed*97+13);
    const n=20, w=56, h=26, pad=3;
    const drift = up ? 0.55 : -0.55;
    let v=0; const pts=[];
    for(let i=0;i<n;i++){ v += (rnd()-0.5)*1.4 + drift*(i/n); pts.push(v); }
    const min=Math.min(...pts), max=Math.max(...pts), span=(max-min)||1;
    const coords = pts.map((p,i)=>{
      const x = pad + i*((w-2*pad)/(n-1));
      const y = h-pad - ((p-min)/span)*(h-2*pad);
      return [x,y];
    });
    const line = coords.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const area = `${pad},${h-pad} ${line} ${(w-pad)},${h-pad}`;
    const col = up ? 'var(--up)' : 'var(--down)';
    const fid = 'g'+seed+(up?'u':'d');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="${fid}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="${area}" fill="url(#${fid})"/>
      <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  function deltaHtml(d){
    if(d==='NEW') return `<div class="delta"><span class="new-badge">NEW</span></div>`;
    if(d==='—')   return `<div class="delta flat">—</div>`;
    const up = d.startsWith('▲');
    return `<div class="delta ${up?'up':'down'}">${d}</div>`;
  }

  const list = document.getElementById('ranklist');
  list.innerHTML = stocks.map(s=>{
    const up = s.chg >= 0;
    const sign = up ? '+' : '';
    const rankCls = s.rank<=3 ? 'top' : 'norm';
    const sep = s.rank===6 ? 'divider-5' : '';
    return `<div class="row ${sep}">
      <div>
        <div class="rank ${rankCls}">${s.rank}</div>
        ${deltaHtml(s.delta)}
      </div>
      <div class="info">
        <div class="nm">${s.name}</div>
        <div class="code">${s.code}</div>
      </div>
      ${sparkline(s.rank, up)}
      <div class="px">
        <div class="price">${s.price}</div>
        <div class="chg ${up?'up':'down'}">${sign}${s.chg.toFixed(2)}%</div>
      </div>
    </div>`;
  }).join('');

  /* ===== Rotating popular keyword in the search box ===== */
  const keywords = ['삼성전자','하이닉스','네이버','현대차'];
  const wordEl = document.getElementById('rotword');
  let ki = 0;
  setInterval(()=>{
    wordEl.classList.add('swap');           // fade out
    setTimeout(()=>{
      ki = (ki+1) % keywords.length;
      wordEl.textContent = keywords[ki];
      wordEl.classList.remove('swap');      // fade in
    }, 350);
  }, 2200);                                  // stays ~2.2s per keyword
</script>
</body>
</html>
