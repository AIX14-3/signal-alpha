apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ─────────────────────────────────────────────────────────────────────────────
# Cloud SQL ×2 오버레이 — DB를 클러스터 밖 관리형 Cloud SQL 2대로 돌리는 변형.
#
# base(`deploy/k8s`)는 in-cluster Postgres(StatefulSet ×2)를 가정한다. 이 오버레이는
# base를 그대로 참조하되:
#   1) 두 Postgres StatefulSet+Service 를 렌더에서 제거(관리형 Cloud SQL 사용),
#   2) 마이그레이션 Job 의 `wait-postgres` initContainer 제거
#      (base 는 in-cluster Service 명 `postgres-collection`/`postgres-backend` 로 pg_isready
#       하는데, Cloud SQL 전환 시 그 Service 가 없어 영원히 대기하게 됨),
#   3) 이미지 핀을 여기서 덮어씀(base 의 PROJECT_ID placeholder 를 직접 수정하지 않기 위함).
#
# DB 접속(DSN)은 전부 Secret `signal-alpha-secrets` 로만 주입된다. 따라서 앱 매니페스트는
# 손대지 않고, Secret 의 *_DATABASE_URL host 만 Cloud SQL Private IP 로 두면 된다(README 참조).
# Secret 은 평문 커밋 금지 → out-of-band 로 `kubectl create secret` (deploy/k8s/secret.example.yaml).
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - ../../k8s

# ① in-cluster Postgres 제거 — 관리형 Cloud SQL 로 대체.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-collection
        namespace: signal-alpha
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-collection
        namespace: signal-alpha
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-backend
        namespace: signal-alpha
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-backend
        namespace: signal-alpha

  # ② 마이그 Job 의 wait-postgres initContainer 제거(Cloud SQL 은 상시 가동·Service 부재).
  - target:
      kind: Job
      name: db-migrate-collection
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: db-migrate-collection
        namespace: signal-alpha
      spec:
        template:
          spec:
            initContainers:
              - name: wait-postgres
                $patch: delete
  - target:
      kind: Job
      name: db-migrate-backend
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: db-migrate-backend
        namespace: signal-alpha
      spec:
        template:
          spec:
            initContainers:
              - name: wait-postgres
                $patch: delete

  # ③ BE 프로덕션 CORS/쿠키 env (커스텀 도메인 — 팀 docs/gabia-domain-cors-setup.md 채택).
  #    base/dev 를 안 건드리게 prod 오버레이에서만 ConfigMap 에 머지한다(도메인은 비밀 아님 → 커밋 OK).
  #    AUTH_SECRET_KEY 만 Secret(out-of-band). ⚠️ APP_ENV=production 이면 main-server 가 부팅 시
  #    AUTH_SECRET_KEY(dev- 금지)·CORS_ALLOW_ORIGINS(빈값/`*` 금지)·ALLOWED_HOSTS(비어있음/`*` 금지) 검증
  #    → 틀리면 CrashLoop(G5/G6/G7). 또한 main-server 는 TrustedHostMiddleware 로 ALLOWED_HOSTS 를 강제하므로
  #    미설정 시 코드 기본값(localhost,127.0.0.1,testserver)이 되어 api.signal-alpha.cloud 요청이 400 이 된다.
  #    도메인 = signal-alpha.cloud (ingress host·managed-cert·web build-arg 와 동일).
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: signal-alpha-config
        namespace: signal-alpha
      data:
        APP_ENV: "production"
        CORS_ALLOW_ORIGINS: "https://www.signal-alpha.cloud"   # 스킴 포함·끝 슬래시 없이. apex 도 받으려면 ,https://signal-alpha.cloud
        ALLOWED_HOSTS: "api.signal-alpha.cloud,www.signal-alpha.cloud"  # TrustedHostMiddleware 강제 — 미설정 시 도메인 요청 400
        COOKIE_SECURE: "true"
        COOKIE_SAMESITE: "lax"
        COOKIE_DOMAIN: ".signal-alpha.cloud"                   # 맨 앞 점 → www·api 서브도메인 쿠키 공유
        # 종목별 뉴스 수집 데몬(agent-worker) 활성 — 기본 false 라 프로덕션에서 데몬이 안 떠서
        # 홈 뉴스가 비어 있었다. 인증은 Secret 의 NAVER_CLIENT_ID/SECRET(데이터랩과 공용 키 쌍).
        # BACKEND_DATABASE_URL(발행 대상)이 있어야 기동한다(database.py 가드). LLM 요약 카드는
        # 별도 게이트(NEWS_LLM_ENABLED + ANTHROPIC_API_KEY)라 여기선 켜지 않는다.
        NEWS_ENABLED: "true"

  # ④ main-server 헬스체크 TCP 전환 — /health 는 TrustedHostMiddleware(ALLOWED_HOSTS)로 Host 를
  #    강제하는데(설계·services/main-server/tests/test_security.py), 쿠버네티스/GCP LB 헬스체크는
  #    Host=PodIP 라 400 → Pod NotReady + LB 백엔드 UNHEALTHY → 도메인 서빙 불가.
  #    TCP 프로브는 Host 검사 없이 포트만 확인 → kubelet Ready + (BackendConfig 부재로 GKE가 probe에서
  #    파생하는) LB 헬스체크도 TCP 라 통과. ※ 근본 대안: main-server 가 /health 를 TrustedHost 예외로
  #    두면(팀원 결정) HTTP 프로브로 되돌릴 것.
  - target:
      kind: Deployment
      name: main-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: main-server
        namespace: signal-alpha
      spec:
        template:
          spec:
            containers:
              - name: main-server
                readinessProbe:
                  httpGet: null
                  tcpSocket:
                    port: 8000
                livenessProbe:
                  httpGet: null
                  tcpSocket:
                    port: 8000

# ⑤ 이미지 핀 — <PROJECT_ID> 를 실제 GCP 프로젝트로 교체하고 newTag 를 빌드 태그로.
#    base 의 placeholder 를 직접 고치지 않기 위해 오버레이에서 덮어쓴다.
images:
  - name: signal-alpha-agent-worker
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/agent-worker
    newTag: latest
  - name: signal-alpha-main-server
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/main-server
    newTag: latest
  - name: signal-alpha-web
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/web
    newTag: latest
  - name: signal-alpha-db-migrate
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/db-migrate
    newTag: latest
