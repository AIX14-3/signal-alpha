# 비밀이 아닌 공용 설정. 모든 유닛이 envFrom 으로 주입한다.
# (DSN/비밀번호/API 키는 secret.example.yaml → Secret 으로 분리)
apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-alpha-config
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
data:
  SERVICE_VERSION: "0.1.0"
  # 배포 환경. production 이면 main-server 부팅 시 _validate_production 가드가 켜져
  # 기본 JWT 시크릿/비-Secure 쿠키/와일드카드 CORS/웹훅 시크릿 누락을 즉시 거부(fail-closed).
  # 비-프로덕션 클러스터(샌드박스)에 base 를 띄울 때만 해당 오버레이에서 development 로 덮어쓴다.
  # (로컬 개발은 docker-compose 라 이 ConfigMap 과 무관.)
  APP_ENV: "production"
  # HTTPS(Ingress) 뒤 배포 — refresh/admin 쿠키 Secure 필수.
  COOKIE_SECURE: "true"
  # ⚠️ 아래 둘은 실도메인으로 반드시 덮어써야 한다(cloudsql 오버레이가 패치). 기본 localhost
  #    값이면 프론트 CORS·TrustedHost 가 막힌다(부팅은 되지만 요청 거부).
  #   CORS_ALLOW_ORIGINS: "https://www.<도메인>"
  #   ALLOWED_HOSTS: "api.<도메인>,www.<도메인>"
  # 워커 내부 URL — scheduler 가 수집 엔드포인트 호출 시 사용(클러스터 DNS).
  WORKER_BASE_URL: "http://agent-worker:8011"
  # 큐 드레인 데몬 순회 대기(초).
  QUEUE_DRAIN_INTERVAL_SEC: "5"
  # 운영 데몬 활성 — self-healing(좀비 sweep·failed 백스탑) + 파이프라인 큐 정지/적체 알림.
  # 기본 off(데몬 관례)지만 운영 클러스터에선 켜서 조용한 노후화를 감지한다. Discord 알림은
  # DISCORD_WEBHOOK_URL(Secret)이 있을 때만 발송되고, 없으면 로그로만 남는다(안전 no-op).
  HIRING_OPS_DAEMON_ENABLED: "true"
  # Kiwoom REST(가격 수집). 운영 키 발급 후 https://api.kiwoom.com 로 교체.
  KIWOOM_API_BASE: "https://mockapi.kiwoom.com"
  KIWOOM_MIN_REQUEST_INTERVAL_SEC: "0.25"
  PRICE_POLL_INTERVAL_SEC: "60"
  PRICE_FLOW_DELAY_AFTER_CLOSE_MIN: "30"
  MARKET_OPEN: "09:00"
  MARKET_CLOSE: "15:30"
  # DART / LLM 비밀 아닌 설정.
  DART_BASE_URL: "https://opendart.fss.or.kr/api"
  DART_TIMEOUT_SECONDS: "10"
  DART_PAGE_SIZE: "100"
  DART_FETCH_DOCUMENTS: "true"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta"
  # 끝단 종합 LLM(키 없으면 결정론 폴백).
  SYNTHESIS_USE_LLM: "false"
  # 리포트 저장 백엔드. 초기 인클러스터 브링업은 local(PVC) — GCS ADC 는 GKE 에서
  # Workload Identity 가 있어야 인증되므로, 외부 서빙이 필요한 컷오버 시점에 gcs 로 전환한다.
  REPORT_STORAGE_BACKEND: "local"
  REPORT_LOCAL_STORAGE_DIR: "/data/report-storage"
  GCS_REPORT_BUCKET: "signal-alpha-reports"
  # ML_INFER 변동성 모델 화이트리스트.
  ML_GATE_PASSED_MODELS: "ewma,har_rv,garch,tcn"
  # Postgres DB/USER(비밀번호는 Secret). 2 인스턴스 공통 논리 DB/USER 명.
  POSTGRES_DB: "signal_alpha"
  POSTGRES_USER: "signal_alpha"
