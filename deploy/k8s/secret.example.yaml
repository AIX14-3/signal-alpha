# 비밀키 템플릿 — 평문 값 커밋 금지. 이 파일은 참고용이며 kustomization.yaml 에 포함하지 않는다.
# 실제 적용: 값 채운 .env 로 아래 명령으로 생성하거나, sealed-secrets/external-secrets 사용.
#
#   kubectl -n signal-alpha create secret generic signal-alpha-secrets \
#     --from-literal=WORKER_DATABASE_URL='postgresql://signal_alpha:PW@postgres-collection:5432/signal_alpha' \
#     --from-literal=BACKEND_DATABASE_URL='postgresql://signal_alpha:PW@postgres-backend:5432/signal_alpha' \
#     --from-literal=MIGRATE_DATABASE_URL='postgresql://signal_alpha:PW@postgres-collection:5432/signal_alpha' \
#     --from-literal=BACKEND_MIGRATE_DATABASE_URL='postgresql://signal_alpha:PW@postgres-backend:5432/signal_alpha' \
#     --from-literal=POSTGRES_PASSWORD='PW' \
#     --from-literal=DART_API_KEY='...' --from-literal=GEMINI_API_KEY='...' \
#     --from-literal=KIWOOM_APP_KEY='...' --from-literal=KIWOOM_APP_SECRET='...' \
#     --from-literal=AUTH_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=PORTONE_WEBHOOK_SECRET='whsec_...' \
#     --from-literal=INTERNAL_API_TOKEN='...'
#
# DSN host 는 클러스터 내 Service 명(postgres-collection / postgres-backend)을 가리킨다.
# ⚠️ APP_ENV=production(configmap) 에서는 AUTH_SECRET_KEY(dev- 접두 금지)·PORTONE_WEBHOOK_SECRET
#    미설정 시 main-server 가 부팅에 실패한다(_validate_production fail-closed).
apiVersion: v1
kind: Secret
metadata:
  name: signal-alpha-secrets
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
type: Opaque
stringData:
  # ── DB DSN (2 인스턴스) ──
  WORKER_DATABASE_URL: "postgresql://signal_alpha:CHANGE_ME@postgres-collection:5432/signal_alpha"
  BACKEND_DATABASE_URL: "postgresql://signal_alpha:CHANGE_ME@postgres-backend:5432/signal_alpha"
  # 마이그레이션(owner) — 학습 단계에선 동일 계정. 운영은 owner 전용 롤 권장.
  MIGRATE_DATABASE_URL: "postgresql://signal_alpha:CHANGE_ME@postgres-collection:5432/signal_alpha"
  BACKEND_MIGRATE_DATABASE_URL: "postgresql://signal_alpha:CHANGE_ME@postgres-backend:5432/signal_alpha"
  # Postgres StatefulSet 비밀번호(양 인스턴스 공용 예시).
  POSTGRES_PASSWORD: "CHANGE_ME"
  # ── 외부 API 키 ──
  DART_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  KIWOOM_APP_KEY: ""
  KIWOOM_APP_SECRET: ""
  KIPRIS_API_KEY: ""
  NAVER_CLIENT_ID: ""
  NAVER_CLIENT_SECRET: ""
  # ── hiring 크롤 배치(hiring-cronjob) 전용 ──
  # 네이버 채용 기준선용(쿼터 분리된 별도 앱). 미설정 시 hiring 기준선 일부가 비고, 크롤 자체는 진행.
  HIRING_DATALAB_CLIENT_ID: ""
  HIRING_DATALAB_CLIENT_SECRET: ""
  # 크롤 실패 시 침묵-실패 트랩 알림(run_hiring_daily.sh). 미설정 시 알림만 생략.
  DISCORD_WEBHOOK_URL: ""
  # ── 인증(JWT) — 프로덕션 필수, dev- 접두 금지 ──
  # openssl rand -hex 32 로 생성. 미설정/기본값이면 APP_ENV=production 에서 부팅 실패.
  AUTH_SECRET_KEY: "CHANGE_ME"
  # ── 내부 인증 / 결제 ──
  # 설정 시 worker /internal/* 가 X-Internal-Token 일치를 요구. scheduler 도 동일 값 사용.
  INTERNAL_API_TOKEN: ""
  PORTONE_API_SECRET: ""
  PORTONE_STORE_ID: ""
  # 포트원 V2 웹훅 서명 시크릿(standard-webhooks). 프로덕션 필수 — 미설정 시 부팅 실패 +
  # 런타임 무서명 웹훅 거부(payments.webhook fail-closed).
  PORTONE_WEBHOOK_SECRET: ""
