# 외부 노출 — 서브도메인 분리(팀 문서 docs/gabia-domain-cors-setup.md 채택):
#   www.<도메인> → web(3000),  api.<도메인> → main-server(8000).
# HTTPS 는 GKE ManagedCertificate(managed-cert.yaml, www+api)로 종단한다.
# 도메인 = signal-alpha.cloud (managed-cert.yaml·CORS·web build-arg 와 동일).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signal-alpha
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # GKE glbc 컨트롤러가 이 Ingress를 자기 것으로 인식하는 방식. 이 클러스터엔 `gce`
    # IngressClass 리소스가 없어 spec.ingressClassName만으론 컨트롤러가 무시(이벤트 <none>,
    # 프로비저닝 0) → 레거시 annotation으로 명시해야 LB가 생성된다.
    kubernetes.io/ingress.class: "gce"
    # 예약한 글로벌 고정 IP 를 *이름*으로 참조(gce 외부 LB 전용, IP 값 아님).
    #   gcloud compute addresses create sa-ingress-ip --global
    # 와 이름 일치 → 재배포해도 도메인이 가리키는 IP 고정. 가비아 A레코드(www·api)가 이 IP 를 가리킨다.
    kubernetes.io/ingress.global-static-ip-name: sa-ingress-ip
    # HTTPS = 자체서명 인증서(k8s Secret signal-alpha-tls). nip.io 는 도메인 소유 증명이
    # 안 돼 Google ManagedCertificate 발급 불가 → 자체서명으로 종단(브라우저 1회 경고).
    # (인증서/키는 out-of-band 로 `kubectl create secret tls` — 평문 커밋 금지.)
    kubernetes.io/ingress.allow-http: "true"
spec:
  # 클래스는 위 annotation(kubernetes.io/ingress.class: gce)으로 지정 — 이 클러스터엔
  # gce IngressClass 리소스가 없어 ingressClassName은 쓰지 않는다.
  tls:
    - hosts:
        - www.34.36.250.174.nip.io
        - api.34.36.250.174.nip.io
      secretName: signal-alpha-tls
  rules:
    # FE — www (nip.io = IP 기반 무료 DNS, 34.36.250.174 로 자동 해석)
    - host: www.34.36.250.174.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    # BE — api (main-server 가 루트에서 /health·/api/* 서빙)
    - host: api.34.36.250.174.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-server
                port:
                  number: 8000
