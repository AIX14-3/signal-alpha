# agent-worker 유닛 — FastAPI(8011) + 큐 드레인 데몬. 분석·정규화·집계·LLM 종합·발행.
# 가격 데몬은 collector 유닛으로 분리되었으므로 PRICE_COLLECTOR_ENABLED=false.
# 리포트 저장(local 백엔드)용 PVC — 워커가 단일 writer 이고 main-server 는 DB api.* view 로
# 읽으므로 RWO 로 충분(RWX/Filestore 불필요). gcs 컷오버 시 이 PVC 는 미사용이 된다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-worker-reports
  namespace: signal-alpha
  annotations:
    # 소비자(agent-worker Deployment)와 같은 wave. 기본 SC(standard-rwo)가
    # WaitForFirstConsumer라 wave 0에 두면 소비자 pod가 없어 영원히 Pending →
    # Argo가 wave 0 완료를 못 기다림(교착). 같은 wave 2에서 pod와 함께 생성되면 바인딩된다.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: signal-alpha
    app.kubernetes.io/name: agent-worker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-worker
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
    app.kubernetes.io/name: agent-worker
spec:
  selector:
    app.kubernetes.io/name: agent-worker
  ports:
    - port: 8011
      targetPort: 8011
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
    app.kubernetes.io/name: agent-worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1                  # 큐 드레인은 advisory lock 으로 단일 소비 — replicas 확장 시 주의
  strategy:
    type: Recreate             # 롤아웃 중 데몬 2중기동 방지: 구 Pod 완전 종료 후 신 Pod 기동
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: signal-alpha
        app.kubernetes.io/name: agent-worker
    spec:
      terminationGracePeriodSeconds: 60   # SIGTERM→lifespan finally(데몬 cancel→pool.close)
      volumes:
        - name: report-storage
          persistentVolumeClaim:
            claimName: agent-worker-reports
      containers:
        - name: agent-worker
          image: signal-alpha-agent-worker
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8011"]
          ports:
            - containerPort: 8011
          envFrom:
            - configMapRef: { name: signal-alpha-config }
            - secretRef: { name: signal-alpha-secrets }
          env:
            - name: SERVICE_NAME
              value: agent-worker
            - name: DATABASE_URL          # 수집 DB (드레인 대상)
              valueFrom: { secretKeyRef: { name: signal-alpha-secrets, key: WORKER_DATABASE_URL } }
            # BACKEND_DATABASE_URL 는 envFrom 으로 주입됨(발행 대상).
            - name: QUEUE_DRAIN_DAEMON_ENABLED
              value: "true"
            - name: PRICE_COLLECTOR_ENABLED
              value: "false"
          readinessProbe:
            httpGet: { path: /health, port: 8011 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8011 }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: report-storage
              mountPath: /data/report-storage   # REPORT_LOCAL_STORAGE_DIR 와 일치
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
