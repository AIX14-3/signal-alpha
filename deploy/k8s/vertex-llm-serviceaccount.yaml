# Vertex AI 호출용 KSA — Workload Identity 로 GSA vertex-llm 에 바인딩된다.
# 배경: 노드 SA 는 cloud-platform 스코프가 없고, org 정책
# (iam.disableServiceAccountKeyCreation)이 SA 키 발급을 금지해 키 파일 경로도 불가 →
# WI 가 유일한 인증 경로. agent-worker(LLM 채점)·datalab-keywords(키워드 LLM)가 사용.
#
# 클러스터 측 전제(out-of-band, scripts/setup_vertex_wi.sh):
#   ①클러스터 workload-pool 활성화 ②노드풀 GKE_METADATA ③GSA에 workloadIdentityUser 바인딩.
# 전제 미완이어도 파드는 뜬다 — ADC 가 노드 metadata 로 폴백해 Vertex 호출만 실패
# (채점은 rules 폴백, 키워드 생성은 에러 로그).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vertex-llm
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
  annotations:
    iam.gke.io/gcp-service-account: vertex-llm@signal-alpha-demo.iam.gserviceaccount.com
