# 수집 DB 마이그레이션 + 시드 (--target collection). database/Dockerfile 이미지.
# ArgoCD Sync 훅으로 매 sync 마다 재실행(migrate.py 는 checksum 원장 기반 멱등).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-collection
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
    app.kubernetes.io/name: db-migrate-collection
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: signal-alpha
        app.kubernetes.io/name: db-migrate-collection
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-postgres
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h postgres-collection -U signal_alpha; do echo waiting; sleep 2; done"]
      containers:
        - name: migrate
          image: signal-alpha-db-migrate
          args: ["apply", "--seeds", "--target", "collection"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: signal-alpha-secrets, key: MIGRATE_DATABASE_URL } }
