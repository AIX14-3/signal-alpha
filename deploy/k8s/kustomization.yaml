apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# secret.example.yaml 은 참고용 템플릿이므로 의도적으로 제외(비밀은 out-of-band 생성).
resources:
  - namespace.yaml
  - configmap.yaml
  - vertex-llm-serviceaccount.yaml
  - postgres-collection.yaml
  - postgres-backend.yaml
  - db-migrate-collection-job.yaml
  - db-migrate-backend-job.yaml
  - agent-worker.yaml
  - collector.yaml
  - scheduler.yaml
  - altdata-cronjob.yaml
  - datalab-keywords-cronjob.yaml
  - hiring-cronjob.yaml
  - journal-outcomes-cronjob.yaml
  - community-rankings-cronjob.yaml
  - trade-signal-overlay-cronjob.yaml
  - main-server.yaml
  - web.yaml
  - ingress.yaml
  - managed-cert.yaml

# 이미지 태그 핀(GitOps). <PROJECT_ID> 를 실제 GCP 프로젝트로 교체하고 newTag 를 빌드 태그로.
images:
  - name: signal-alpha-agent-worker
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/agent-worker
    newTag: sha-ea896b15de54
  # hiring 크롤러 전용(agent-worker + chromium). Dockerfile.crawler 로 별도 빌드/푸시 필요 —
  # 이 핀이 없거나 이미지 미푸시면 hiring-crawl CronJob 이 ImagePullBackOff.
  - name: signal-alpha-hiring-crawler
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/hiring-crawler
    newTag: sha-ea896b15de54
  - name: signal-alpha-main-server
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/main-server
    newTag: sha-ea896b15de54
  - name: signal-alpha-web
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/web
    newTag: sha-ea896b15de54
  - name: signal-alpha-db-migrate
    newName: asia-northeast3-docker.pkg.dev/signal-alpha-demo/signal-alpha/db-migrate
    newTag: sha-ea896b15de54
