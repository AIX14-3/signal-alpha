# main-server 유닛 — FastAPI 사용자 API(8000). 백엔드 DB 만 접근(signal_backend: api.* + 소유 테이블).
# worker 런타임 의존 없음(워커 산출물은 발행 사본 api.* view 로 읽음).
apiVersion: v1
kind: Service
metadata:
  name: main-server
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
    app.kubernetes.io/name: main-server
spec:
  selector:
    app.kubernetes.io/name: main-server
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-server
  namespace: signal-alpha
  labels:
    app.kubernetes.io/part-of: signal-alpha
    app.kubernetes.io/name: main-server
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1                  # ⚠️ 1 고정 — rate limit/로그인 잠금이 프로세스 인메모리라 확장 시
                               #    무력화(레플리카마다 별도 카운터). replicas>1 전에 Redis 공유 저장소 필요.
  selector:
    matchLabels:
      app.kubernetes.io/name: main-server
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: signal-alpha
        app.kubernetes.io/name: main-server
    spec:
      containers:
        - name: main-server
          image: signal-alpha-main-server
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: signal-alpha-config }
            - secretRef: { name: signal-alpha-secrets }
          env:
            - name: SERVICE_NAME
              value: main-server
            - name: DATABASE_URL          # 백엔드 DB
              valueFrom: { secretKeyRef: { name: signal-alpha-secrets, key: BACKEND_DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
