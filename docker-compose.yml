# Local development compose file.
# Production should use a managed PostgreSQL/pgvector database instead of this postgres service.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: signal-alpha-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signal_alpha}
      POSTGRES_USER: ${POSTGRES_USER:-signal_alpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal_alpha_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-signal_alpha} -d ${POSTGRES_DB:-signal_alpha}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 일회성 마이그레이션 적용 컨테이너. 사용법: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: ./services/agent-worker/Dockerfile
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./database:/workspace/database
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://signal_alpha:signal_alpha_password@postgres:5432/signal_alpha}
    command: python database/migrate.py apply --seeds
    depends_on:
      postgres:
        condition: service_healthy

  agent-worker:
    build:
      context: .
      dockerfile: ./services/agent-worker/Dockerfile
    container_name: signal-alpha-agent-worker
    working_dir: /workspace/services/agent-worker
    volumes:
      - ./services/agent-worker:/workspace/services/agent-worker
      - ./packages/data-access:/workspace/packages/data-access
      - ./data:/workspace/data
    environment:
      SERVICE_NAME: agent-worker
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://signal_alpha:signal_alpha_password@postgres:5432/signal_alpha}
      PYTHONPATH: /workspace/services/agent-worker:/workspace/packages/data-access
      WATCHFILES_FORCE_POLLING: "true"
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      DART_API_KEY: ${DART_API_KEY:-}
      DART_BASE_URL: ${DART_BASE_URL:-https://opendart.fss.or.kr/api}
      DART_TIMEOUT_SECONDS: ${DART_TIMEOUT_SECONDS:-10}
      DART_PAGE_SIZE: ${DART_PAGE_SIZE:-100}
      DART_FETCH_DOCUMENTS: ${DART_FETCH_DOCUMENTS:-true}
      DART_MAX_RETRIES: ${DART_MAX_RETRIES:-2}
      DART_RETRY_BACKOFF_SECONDS: ${DART_RETRY_BACKOFF_SECONDS:-0.5}
      DART_USE_LLM: ${DART_USE_LLM:-false}
      DART_LLM_HIGH_IMPACT_ONLY: ${DART_LLM_HIGH_IMPACT_ONLY:-true}
      DART_LLM_PROVIDER: ${DART_LLM_PROVIDER:-gemini}
      DART_LLM_MODEL: ${DART_LLM_MODEL:-gemini-2.0-flash}
      DART_LLM_TIMEOUT_SECONDS: ${DART_LLM_TIMEOUT_SECONDS:-20}
      REPORT_USE_LLM: ${REPORT_USE_LLM:-false}
      REPORT_LLM_PROVIDER: ${REPORT_LLM_PROVIDER:-gemini}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-gemini-2.0-flash}
      REPORT_LLM_TIMEOUT_SECONDS: ${REPORT_LLM_TIMEOUT_SECONDS:-20}
      REPORT_STORAGE_BACKEND: ${REPORT_STORAGE_BACKEND:-local}
      REPORT_LOCAL_STORAGE_DIR: /workspace/data/report-storage
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCS_REPORT_BUCKET: ${GCS_REPORT_BUCKET:-signal-alpha-reports}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # 실시간 가격 수집 데몬 (agent-worker 내장 백그라운드 태스크)
      PRICE_COLLECTOR_ENABLED: ${PRICE_COLLECTOR_ENABLED:-true}
      KIWOOM_APP_KEY: ${KIWOOM_APP_KEY:-}
      KIWOOM_APP_SECRET: ${KIWOOM_APP_SECRET:-}
      KIWOOM_API_BASE: ${KIWOOM_API_BASE:-https://mockapi.kiwoom.com}
      KIWOOM_MIN_REQUEST_INTERVAL_SEC: ${KIWOOM_MIN_REQUEST_INTERVAL_SEC:-0.25}
      PRICE_POLL_INTERVAL_SEC: ${PRICE_POLL_INTERVAL_SEC:-60}
      PRICE_FLOW_DELAY_AFTER_CLOSE_MIN: ${PRICE_FLOW_DELAY_AFTER_CLOSE_MIN:-30}
    ports:
      - "${AGENT_WORKER_PORT:-8011}:8011"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8011 --reload
    depends_on:
      postgres:
        condition: service_healthy

  # 신규 멀티소스 분석 harness (HIRING/PATENT/DATALAB → final_signals).
  # run_analyzers.py 내장 루프(--loop)로 주기 실행. analyzers는 순수(LLM 미호출),
  # 타깃 종목·임계값은 DB/env에서 옴(하드코딩 없음).
  #
  # opt-in 프로파일: 레거시 hiring 파이프라인(script/run_daily_hiring_pipeline.py →
  # hiring_signals)과의 parity_hiring.py 방향 일치율 검증을 통과하기 전까지는
  # 기본 `docker compose up`에서 제외(= final_signals 이중기록 방지). 명시적 기동:
  #     docker compose --profile analyzer up analyzer
  # cron/Airflow 대안: 스케줄러에서 `--loop` 없이 1회씩 실행
  #     python run_analyzers.py            # 1 pass
  # 검증 완료 후 단독 운영 전환 시 profiles 줄을 제거해 기본 서비스로 승격.
  analyzer:
    build:
      context: .
      dockerfile: ./services/agent-worker/Dockerfile
    container_name: signal-alpha-analyzer
    profiles: ["analyzer"]
    working_dir: /workspace/services/agent-worker
    volumes:
      - ./services/agent-worker:/workspace/services/agent-worker
      - ./packages/data-access:/workspace/packages/data-access
      # market-data(PSR 파생)는 analyzer가 소비하므로 마운트 + PYTHONPATH에 포함.
      # 이미지엔 source가 COPY/설치되지 않으므로(agent-worker pyproject 미의존)
      # 현재는 이 dev 바인드마운트로만 import 가능 — prod 사용 시 의존성 선언 필요.
      - ./packages/market-data:/workspace/packages/market-data
    environment:
      SERVICE_NAME: analyzer
      DATABASE_URL: ${DATABASE_URL:-postgresql://signal_alpha:signal_alpha_password@postgres:5432/signal_alpha}
      PYTHONPATH: /workspace/services/agent-worker:/workspace/packages/data-access:/workspace/packages/market-data
    command: >
      python run_analyzers.py --loop --interval-seconds ${ANALYZER_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  main-server:
    build:
      context: .
      dockerfile: ./services/main-server/Dockerfile
    container_name: signal-alpha-main-server
    working_dir: /workspace/services/main-server
    volumes:
      - ./services/main-server:/workspace/services/main-server
      - ./packages/data-access:/workspace/packages/data-access
    environment:
      SERVICE_NAME: main-server
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://signal_alpha:signal_alpha_password@postgres:5432/signal_alpha}
      PYTHONPATH: /workspace/services/main-server:/workspace/packages/data-access
      WATCHFILES_FORCE_POLLING: "true"
      AGENT_WORKER_BASE_URL: ${AGENT_WORKER_BASE_URL:-http://agent-worker:8011}
    ports:
      - "${MAIN_SERVER_PORT:-8000}:8000"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      agent-worker:
        condition: service_started

  web:
    build:
      context: ./web
    container_name: signal-alpha-web
    working_dir: /app
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    environment:
      NEXT_PUBLIC_MAIN_API_BASE_URL: ${NEXT_PUBLIC_MAIN_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: >
      npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      main-server:
        condition: service_started

volumes:
  postgres-data:
  web-node-modules:
