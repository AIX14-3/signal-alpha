# Alembic config -- Signal alpha DB migrations (ORM-based, hybrid adoption).
#
# The legacy SQL runner (database/migrate.py + database/migrations/001~023) is frozen and
# forms the "baseline". All further add/modify/delete is managed by Alembic.
# Docs (Korean): database/alembic/README.md
#
# Usage (from repo root):
#   alembic stamp 0001_baseline_after_023        # mark an existing (023-applied) DB as baseline
#   alembic revision --autogenerate -m "add X"   # generate a migration from model changes
#   alembic upgrade head                          # apply
#   alembic downgrade -1                          # roll back one revision
#   alembic history / current / heads            # status
#
# DB connection is injected by env.py from DATABASE_URL (env var or root .env);
# sqlalchemy.url below is intentionally empty (no secrets in this file).

[alembic]
script_location = database/alembic

# Make signal_alpha_data_access (models) importable without installation.
prepend_sys_path = packages/data-access

# Revision filenames = timestamp + slug -> no filename collisions on parallel branches
# (replaces fragile integer numbering; ordering is decided by the down_revision DAG).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Filled by env.py from DATABASE_URL.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
