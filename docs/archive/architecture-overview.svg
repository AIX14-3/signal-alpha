<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1075" viewBox="0 0 1260 1075" font-family="'Segoe UI','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#374151"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/>
    </marker>
  </defs>

  <style>
    .t  { font-size:13px; font-weight:600; fill:#111827; }
    .s  { font-size:11px; fill:#4b5563; }
    .ttl{ font-size:24px; font-weight:700; fill:#0f172a; }
    .sub{ font-size:13px; fill:#475569; }
    .sec{ font-size:14px; font-weight:700; fill:#1f2937; }
    .lbl{ font-size:11px; fill:#374151; font-style:italic; }
    .arrow { stroke:#374151; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .dash  { stroke:#db2777; stroke-width:1.6; fill:none; stroke-dasharray:5 4; marker-end:url(#arrowDash); }
    .box { rx:10; }
  </style>

  <rect x="0" y="0" width="1260" height="1075" fill="#ffffff"/>

  <!-- Title -->
  <text x="630" y="38" text-anchor="middle" class="ttl">Signal α — 시스템 아키텍처 설계도</text>
  <text x="630" y="62" text-anchor="middle" class="sub">투자 신호 분석 플랫폼 · FastAPI 백엔드(main-server + agent-worker) + Next.js 프론트엔드 · 2026-06-17</text>

  <!-- ================= TOP ROW: client → frontend → api ================= -->
  <!-- User -->
  <rect x="70" y="85" width="150" height="72" class="box" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="145" y="118" text-anchor="middle" class="t">사용자 / 브라우저</text>
  <text x="145" y="138" text-anchor="middle" class="s">웹 대시보드 이용</text>

  <!-- Frontend -->
  <rect x="270" y="85" width="250" height="72" class="box" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="395" y="112" text-anchor="middle" class="t">프론트엔드 · Next.js 15</text>
  <text x="395" y="131" text-anchor="middle" class="s">React 19 · TypeScript · web :3000</text>
  <text x="395" y="148" text-anchor="middle" class="s">final_signals 시각화(방향성 일치도)</text>

  <!-- main-server -->
  <rect x="590" y="85" width="270" height="72" class="box" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="725" y="112" text-anchor="middle" class="t">백엔드 API · main-server</text>
  <text x="725" y="131" text-anchor="middle" class="s">FastAPI :8000 (사용자 대면)</text>
  <text x="725" y="148" text-anchor="middle" class="s">GET /signals/{ticker} · /health</text>

  <!-- arrows client→fe→api -->
  <line x1="220" y1="121" x2="266" y2="121" class="arrow"/>
  <line x1="520" y1="121" x2="586" y2="121" class="arrow"/>
  <text x="555" y="113" text-anchor="middle" class="lbl">REST/HTTPS</text>

  <!-- main-server → DB -->
  <line x1="725" y1="157" x2="725" y2="246" class="arrow"/>
  <text x="735" y="205" class="lbl">final_signals 읽기 (read-only)</text>

  <!-- ================= DB ================= -->
  <rect x="500" y="250" width="440" height="250" class="box" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="720" y="276" text-anchor="middle" class="sec">PostgreSQL 16 + pgvector  ·  약 52 tables</text>

  <rect x="516" y="290" width="408" height="34" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="524" y="312" class="s" font-weight="600" fill="#9a3412">L3 · final_signals  ← 사용자에게 노출되는 게시 신호</text>

  <rect x="516" y="330" width="408" height="34" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="524" y="352" class="s">L2 · analysis_results · agent_results (소스별 결과)</text>

  <rect x="516" y="370" width="408" height="34" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="524" y="392" class="s">L1 · source_documents · signal_events · signal_metrics</text>

  <rect x="516" y="410" width="408" height="34" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="524" y="432" class="s">L0 · raw_documents · *_raw_details · report_chunks (vector)</text>

  <rect x="516" y="450" width="408" height="36" rx="6" fill="#f0fdf4" stroke="#a7f3d0"/>
  <text x="524" y="473" class="s">보조 · stocks · ohlcv_data · processing_queue · users · admin</text>

  <!-- agent-worker → DB write -->
  <line x1="600" y1="556" x2="600" y2="502" class="arrow"/>
  <text x="610" y="533" class="lbl">결과 쓰기 L0→L3 (분석 시 읽기)</text>

  <!-- ================= EXTERNAL SOURCES (left column) ================= -->
  <rect x="60" y="560" width="165" height="400" class="box" fill="#f9fafb" stroke="#6b7280" stroke-width="1.6"/>
  <text x="142" y="586" text-anchor="middle" class="sec" font-size="13px">외부 데이터 소스</text>
  <text x="75" y="616" class="s">• DART (FSS 공시)</text>
  <text x="75" y="642" class="s">• 증권사 리포트 (S3)</text>
  <text x="75" y="668" class="s">• 채용 사이트 (크롤링)</text>
  <text x="75" y="694" class="s">• KIPRIS (특허)</text>
  <text x="75" y="720" class="s">• NAVER DataLab</text>
  <text x="75" y="746" class="s">• 키움 REST (시세)</text>
  <text x="75" y="772" class="s">• SEC EDGAR (미국)</text>
  <text x="75" y="804" class="lbl" font-size="10px">수집 대상(읽기 전용)</text>

  <!-- external → collectors -->
  <line x1="225" y1="720" x2="266" y2="720" class="arrow"/>
  <text x="246" y="712" text-anchor="middle" class="lbl">수집</text>

  <!-- ================= AGENT-WORKER ================= -->
  <rect x="245" y="560" width="805" height="400" class="box" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="647" y="584" text-anchor="middle" class="sec" fill="#5b21b6">agent-worker · FastAPI :8011  —  수집·정규화·분석 파이프라인 + 가격수집 데몬</text>

  <!-- Collectors -->
  <rect x="270" y="645" width="180" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="360" y="672" text-anchor="middle" class="t">Collectors</text>
  <text x="360" y="700" text-anchor="middle" class="s">DART · Report · Hiring</text>
  <text x="360" y="720" text-anchor="middle" class="s">Patent · DataLab</text>
  <text x="360" y="740" text-anchor="middle" class="s">Price · SEC</text>
  <text x="360" y="768" text-anchor="middle" class="s" fill="#7c3aed">→ raw_documents</text>

  <!-- Normalizers -->
  <rect x="470" y="645" width="160" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="550" y="672" text-anchor="middle" class="t">Normalizers</text>
  <text x="550" y="702" text-anchor="middle" class="s">정규화 · 중복제거</text>
  <text x="550" y="722" text-anchor="middle" class="s">raw → signal_events</text>
  <text x="550" y="768" text-anchor="middle" class="s" fill="#7c3aed">→ L1 테이블</text>

  <!-- Analyzers -->
  <rect x="650" y="645" width="170" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="735" y="672" text-anchor="middle" class="t">Analyzers</text>
  <text x="735" y="702" text-anchor="middle" class="s">소스별 SourceResult</text>
  <text x="735" y="722" text-anchor="middle" class="s">rule + LLM(RAG)</text>
  <text x="735" y="768" text-anchor="middle" class="s" fill="#7c3aed">개별 score/direction</text>

  <!-- Aggregator -->
  <rect x="840" y="645" width="200" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="940" y="672" text-anchor="middle" class="t">Aggregator</text>
  <text x="940" y="700" text-anchor="middle" class="s">AlternativeAggregator</text>
  <text x="940" y="720" text-anchor="middle" class="s">→ AlternativeSignal</text>
  <text x="940" y="740" text-anchor="middle" class="s">(per_source 보존)</text>
  <text x="940" y="768" text-anchor="middle" class="s" fill="#7c3aed">→ final_signals</text>

  <!-- pipeline arrows -->
  <line x1="450" y1="720" x2="466" y2="720" class="arrow"/>
  <line x1="630" y1="720" x2="646" y2="720" class="arrow"/>
  <line x1="820" y1="720" x2="836" y2="720" class="arrow"/>

  <!-- processing_queue -->
  <rect x="270" y="815" width="770" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="655" y="842" text-anchor="middle" class="s" font-weight="600" fill="#5b21b6">processing_queue — 큐 기반 비동기 오케스트레이션 (collect → normalize → analyze → aggregate)</text>

  <!-- price daemon note -->
  <text x="270" y="895" class="s" fill="#6d28d9">가격수집 데몬(lifespan): 장중 OHLCV 적재 → ohlcv_data</text>

  <!-- ================= LLM ================= -->
  <rect x="1075" y="620" width="170" height="175" class="box" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <text x="1160" y="650" text-anchor="middle" class="t" fill="#9d174d">LLM</text>
  <text x="1160" y="678" text-anchor="middle" class="s">Gemini / OpenAI</text>
  <text x="1160" y="702" text-anchor="middle" class="s">DART · Report 분석</text>
  <text x="1160" y="722" text-anchor="middle" class="s">RAG 근거 종합</text>
  <text x="1160" y="752" text-anchor="middle" class="s">JSON 스키마 강제</text>
  <text x="1160" y="772" text-anchor="middle" class="s">+ rule fallback</text>

  <!-- LLM ↔ Analyzers (orthogonal route to avoid Aggregator) -->
  <polyline points="1075,705 1075,618 735,618 735,641" class="dash"/>
  <text x="900" y="610" text-anchor="middle" class="lbl" fill="#db2777">LLM 종합(RAG)</text>

  <!-- ================= packages band ================= -->
  <rect x="60" y="975" width="1185" height="46" class="box" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="652" y="1004" text-anchor="middle" class="t">공용 패키지 packages/ :  data-access (asyncpg Repository)  ·  signal-core (안전·면책 필터)  ·  market-data (PSR·PER valuation)</text>

  <!-- footnote -->
  <text x="60" y="1048" class="s" fill="#9a3412">※ 현재 final_signals 통합 범위 = alternative 3소스(hiring·patent·datalab). DART·Report·Price는 자체 경로 → 전체 통합은 설계 과제.</text>
  <text x="60" y="1066" class="s" fill="#9a3412">※ 프론트 ↔ main-server API 연동(스키마 계약)과 엔드포인트 확장은 제작 예정. 빨간 테두리 final_signals가 양쪽 설계의 접점.</text>
</svg>
