<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1180" viewBox="0 0 1480 1180" font-family="'Segoe UI','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <style>
      text{fill:#0f172a;}
      .title{font-size:23px;font-weight:700;}
      .sub{font-size:12px;fill:#475569;}
      .sec{font-size:15px;font-weight:700;fill:#0f172a;}
      .h{font-size:13.5px;font-weight:700;}
      .s{font-size:11px;fill:#334155;}
      .c{font-family:'Consolas','D2Coding',monospace;font-size:11px;}
      .lbl{font-size:10.5px;fill:#64748b;}
      .albl{font-size:10.5px;fill:#475569;font-weight:600;}
      .badge{font-size:11px;font-weight:700;}
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="1180" fill="#ffffff"/>

  <!-- ============ HEADER ============ -->
  <text x="40" y="40" class="title" fill="#0f172a">Signal α — agent-worker 설계도</text>
  <text x="40" y="62" class="sub">services/agent-worker 한 코드베이스 → worker · collector · scheduler 3 유닛 기동 · DB 2 인스턴스(수집/백엔드, #531) · 워커 드레인 데몬이 큐를 발행까지 연속 소비(#11)</text>

  <!-- ============ ① 배포 토폴로지 ============ -->
  <text x="40" y="98" class="sec">① 배포 토폴로지 — 5 컴퓨트 유닛 + DB 2 인스턴스</text>
  <rect x="40" y="110" width="1400" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Scheduler -->
  <rect x="64" y="134" width="226" height="104" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="80" y="159" class="h" fill="#92400e">스케줄러 유닛</text>
  <text x="80" y="180" class="c" fill="#7c2d12">run_scheduler_instance.py</text>
  <text x="80" y="200" class="s">워커 /internal/schedules/*</text>
  <text x="80" y="217" class="s">주기 HTTP 호출(수집 스케줄)</text>
  <text x="80" y="232" class="lbl">로직 없음 — 엔드포인트만 호출</text>

  <!-- Collector -->
  <rect x="316" y="134" width="226" height="104" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="332" y="159" class="h" fill="#166534">수집기 유닛</text>
  <text x="332" y="180" class="c" fill="#14532d">run_collector_instance.py</text>
  <text x="332" y="200" class="s">키움 실시간 가격 데몬</text>
  <text x="332" y="217" class="s">run_collectors(patent/datalab)</text>
  <text x="332" y="232" class="lbl">원천 수집 → 수집 DB write</text>

  <!-- Worker -->
  <rect x="568" y="134" width="300" height="104" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="586" y="159" class="h" fill="#9a3412">워커 유닛 (uvicorn + 큐 드레인 데몬)</text>
  <text x="586" y="180" class="s">API 8라우트 · 분석·정규화·집계·LLM 종합</text>
  <text x="586" y="199" class="c" fill="#7c2d12">QUEUE_DRAIN_DAEMON_ENABLED=true</text>
  <text x="586" y="216" class="s">processing_queue → 발행까지 연속 소비</text>
  <text x="586" y="231" class="lbl">advisory-lock 단일 기동 · 단발검증 run_worker_drain.py</text>

  <!-- 수집 DB -->
  <rect x="894" y="134" width="258" height="104" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="910" y="159" class="h" fill="#5b21b6">수집 DB — Postgres ①</text>
  <text x="910" y="180" class="s">processing_queue · stocks · signal_events</text>
  <text x="910" y="198" class="s">analysis_results · agent_results</text>
  <text x="910" y="216" class="s">final_signals · ml_inferences · meta_signals</text>
  <text x="910" y="232" class="lbl">롤 signal_worker (public DML)</text>

  <!-- 백엔드 DB -->
  <rect x="1176" y="134" width="240" height="104" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="1192" y="159" class="h" fill="#6b21a8">백엔드 DB — Postgres ②</text>
  <text x="1192" y="180" class="s">PUBLISHED 발행 사본</text>
  <text x="1192" y="198" class="s">api.signals_current</text>
  <text x="1192" y="216" class="s">+ BACKEND 15테이블(회원/결제…)</text>
  <text x="1192" y="232" class="lbl">main-server 가 api.* 읽기</text>

  <!-- topology arrows -->
  <line x1="290" y1="172" x2="566" y2="172" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="300" y="166" class="albl">HTTP POST /schedules/*</text>
  <line x1="429" y1="238" x2="429" y2="252" stroke="#475569" stroke-width="1.6"/>
  <path d="M429,252 L429,272 L1010,272 L1010,240" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="600" y="288" class="albl" fill="#166534">collector → 수집 DB (원천 적재)</text>
  <line x1="868" y1="180" x2="892" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="700" y="200" class="albl" fill="#9a3412"> </text>
  <line x1="1152" y1="200" x2="1174" y2="200" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrP)"/>
  <text x="965" y="128" class="albl" fill="#7c3aed">worker → 수집DB: drain DML</text>
  <text x="1158" y="128" class="albl" fill="#9333ea">publish</text>

  <!-- ============ ② 큐 드레인 파이프라인 ============ -->
  <text x="40" y="318" class="sec">② 큐 드레인 파이프라인 — 워커 드레인 데몬이 processing_queue 를 체인 순서로 끝단(발행)까지 연속 소비</text>
  <rect x="40" y="332" width="1400" height="92" rx="10" fill="#fff7ed" stroke="#fdba74"/>

  <!-- chain boxes -->
  <g>
    <rect x="60" y="356" width="150" height="44" rx="7" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="135" y="376" text-anchor="middle" class="c" fill="#1e3a8a">COLLECT_*</text>
    <text x="135" y="392" text-anchor="middle" class="lbl">dart · report</text>

    <rect x="232" y="356" width="150" height="44" rx="7" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="307" y="376" text-anchor="middle" class="c" fill="#1e3a8a">NORMALIZE_*</text>
    <text x="307" y="392" text-anchor="middle" class="lbl">signal_events</text>

    <rect x="404" y="356" width="150" height="44" rx="7" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="479" y="376" text-anchor="middle" class="c" fill="#1e3a8a">ANALYZE_*</text>
    <text x="479" y="392" text-anchor="middle" class="lbl">dart·report·price·alt</text>

    <rect x="766" y="356" width="150" height="44" rx="7" fill="#f1f5f9" stroke="#475569"/>
    <text x="841" y="376" text-anchor="middle" class="c" fill="#334155">AGGREGATE</text>
    <text x="841" y="392" text-anchor="middle" class="lbl">소스 정렬+근거</text>

    <rect x="938" y="356" width="140" height="44" rx="7" fill="#ecfccb" stroke="#65a30d"/>
    <text x="1008" y="376" text-anchor="middle" class="c" fill="#3f6212">SYNTHESIZE</text>
    <text x="1008" y="392" text-anchor="middle" class="lbl">끝단 LLM(temp=0)</text>

    <rect x="1100" y="356" width="150" height="44" rx="7" fill="#f1f5f9" stroke="#475569"/>
    <text x="1175" y="376" text-anchor="middle" class="c" fill="#334155">RISK_VETO</text>
    <text x="1175" y="392" text-anchor="middle" class="lbl">치명 키워드 → 발행 게이트</text>

    <rect x="1272" y="356" width="148" height="44" rx="7" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="1346" y="376" text-anchor="middle" class="c" fill="#6b21a8">PUBLISH</text>
    <text x="1346" y="392" text-anchor="middle" class="lbl">→ 백엔드 DB</text>
  </g>
  <line x1="210" y1="378" x2="231" y2="378" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="382" y1="378" x2="403" y2="378" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="554" y1="378" x2="765" y2="378" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="916" y1="378" x2="937" y2="378" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="1078" y1="378" x2="1099" y2="378" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="1250" y1="378" x2="1271" y2="378" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- ============ ③ 소스 라우팅 ============ -->
  <text x="40" y="478" class="sec">③ 소스별 라우팅 — 헤드라인 점수=결정론 집계(DART+대체데이터) · 주가=별도 예측(price_prediction) · REPORT=근거 · 끝단 LLM이 합쳐 서술</text>
  <rect x="40" y="492" width="1400" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- PRICE (score lane) -->
  <rect x="64" y="516" width="300" height="96" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="80" y="540" class="h" fill="#065f46">PRICE — 주가 기술지표(규칙)</text>
  <text x="80" y="561" class="s">analyzers/price · indicators/rules (ML/DL 아님)</text>
  <text x="80" y="580" class="s">정량 예측 → score_breakdown.PRICE</text>
  <text x="80" y="599" class="albl" fill="#047857">⇒ price_prediction · ML/DL 모델은 §4 src_price</text>

  <!-- evidence sources -->
  <rect x="64" y="636" width="300" height="132" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="660" class="h" fill="#1e40af">대체데이터 — 근거(evidence)</text>
  <text x="80" y="682" class="s">DART 공시 → 끝단 LLM 정제 (+ RISK_VETO 룰)</text>
  <text x="80" y="702" class="s">증권사 리포트 → 투자의견 컨센서스(결정론 방향)</text>
  <text x="80" y="722" class="s">Alternative — hiring · patent · datalab</text>
  <text x="80" y="745" class="lbl">계약 method_detail{source,score,direction,data_status}</text>
  <text x="80" y="761" class="lbl">검증기 aggregation/source_contract.py</text>

  <!-- AGGREGATE node (routing) -->
  <rect x="430" y="560" width="250" height="150" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="446" y="584" class="h" fill="#334155">AGGREGATE</text>
  <text x="446" y="606" class="s">집계 점수 final_score</text>
  <text x="446" y="625" class="albl" fill="#334155">= SCORING_SOURCES</text>
  <text x="446" y="643" class="s">(DART·HIRING·PATENT·DATALAB) — 뒤집지 않음</text>
  <text x="446" y="667" class="s">PRICE·REPORT = 근거로 수집</text>
  <text x="446" y="687" class="lbl">대체데이터 점수 산술블렌드 X</text>

  <!-- SYNTHESIZE node -->
  <rect x="748" y="560" width="300" height="150" rx="9" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
  <text x="764" y="584" class="h" fill="#3f6212">SYNTHESIZE — 끝단 LLM (temperature=0)</text>
  <text x="764" y="608" class="s">입력: 집계 점수 + price_prediction + 근거</text>
  <text x="764" y="628" class="albl" fill="#3f6212">점수 불변 · "이 점수가 나온 이유"만 서술</text>
  <text x="764" y="650" class="s">주가 단독 예측은 별도 라인으로 노출</text>
  <text x="764" y="673" class="lbl">prompts/synthesis_v1.md</text>
  <text x="764" y="691" class="lbl">결정론 폴백(LLM 미설정 시)</text>

  <!-- result -->
  <rect x="1116" y="560" width="300" height="150" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="1132" y="584" class="h" fill="#6b21a8">final_signals + RiskReport(JSON)</text>
  <text x="1132" y="607" class="s">final_score · signal · price_prediction</text>
  <text x="1132" y="626" class="s">report_valuation · evidence · narrative</text>
  <text x="1132" y="649" class="albl" fill="#7c3aed">→ PUBLISH_SIGNALS → 백엔드 DB</text>
  <text x="1132" y="671" class="s">→ api.signals_current → web 대시보드</text>

  <!-- routing arrows -->
  <line x1="364" y1="564" x2="428" y2="600" stroke="#059669" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="356" y="556" class="albl" fill="#047857">price_prediction</text>
  <line x1="364" y1="676" x2="428" y2="650" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="360" y="640" class="albl">근거 수집</text>
  <line x1="680" y1="635" x2="746" y2="635" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="1048" y1="635" x2="1114" y2="635" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- ============ ④ 메타러너 라인 (배선됨) ============ -->
  <text x="40" y="846" class="sec">④ 메타러너 + 대체데이터 → 예측 라인 (배선됨 · 아티팩트 학습 대기)</text>
  <rect x="40" y="860" width="1400" height="190" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="6 4"/>
  <rect x="1218" y="872" width="202" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1319" y="892" text-anchor="middle" class="badge" fill="#047857">✅ 배선됨 (학습 대기)</text>

  <rect x="64" y="912" width="270" height="110" rx="9" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="80" y="936" class="h" fill="#4b5563">SRC_INFER (배선됨)</text>
  <text x="80" y="958" class="s">소스 정형피처 → base 모델</text>
  <text x="80" y="977" class="c" fill="#6b7280">src_datalab · src_hiring (LightGBM)</text>
  <text x="80" y="996" class="lbl">아티팩트: app/ml/artifacts/source_models/*.txt</text>
  <text x="80" y="1012" class="lbl">ANALYZE_PRICE 가 SRC_INFER 인큐(#579)</text>

  <rect x="402" y="912" width="270" height="110" rx="9" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="418" y="936" class="h" fill="#4b5563">RETURN_COMBINE</text>
  <text x="418" y="958" class="s">src_* + Report 피처 결합</text>
  <text x="418" y="977" class="s">→ forward-return 예측</text>
  <text x="418" y="1000" class="lbl">app/ml/return_combine.py</text>

  <rect x="740" y="912" width="270" height="110" rx="9" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="756" y="936" class="h" fill="#4b5563">meta_signals(run_key=SRC)</text>
  <text x="756" y="958" class="s">return: final_score/direction</text>
  <text x="756" y="977" class="s">/confidence</text>
  <text x="756" y="1000" class="lbl">run_key=SRC 분리 적재 (vol 채널 제거됨)</text>

  <rect x="1078" y="912" width="338" height="110" rx="9" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="1094" y="936" class="h" fill="#92400e">남은 작업 (실값화)</text>
  <text x="1094" y="957" class="s">✓ 라인 배선(ANALYZE_PRICE→SRC_INFER) · ✓ source_predictions 합류</text>
  <text x="1094" y="975" class="s">▶ base 모델 아티팩트 학습(train_source_models.py)</text>
  <text x="1094" y="993" class="s">  — src_price 만 학습됨, 나머지는 실적재·학습 대기</text>
  <text x="1094" y="1013" class="lbl">문서 docs/spec/worker-design-and-handoff.md</text>

  <line x1="334" y1="967" x2="400" y2="967" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <line x1="672" y1="967" x2="738" y2="967" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <line x1="1010" y1="967" x2="1076" y2="967" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/>

  <!-- ============ LEGEND ============ -->
  <text x="40" y="1090" class="sec">범례</text>
  <rect x="40" y="1102" width="20" height="14" rx="3" fill="#d1fae5" stroke="#059669"/>
  <text x="66" y="1113" class="s">주가(점수·별도 예측)</text>
  <rect x="230" y="1102" width="20" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="256" y="1113" class="s">대체데이터(근거)</text>
  <rect x="400" y="1102" width="20" height="14" rx="3" fill="#ecfccb" stroke="#65a30d"/>
  <text x="426" y="1113" class="s">끝단 LLM 종합</text>
  <rect x="560" y="1102" width="20" height="14" rx="3" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="586" y="1113" class="s">발행/백엔드</text>
  <rect x="710" y="1102" width="20" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="736" y="1113" class="s">메타러너 라인(배선됨·학습 대기)</text>
  <line x1="980" y1="1109" x2="1010" y2="1109" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrP)"/>
  <text x="1016" y="1113" class="s">publish 경계</text>
</svg>
