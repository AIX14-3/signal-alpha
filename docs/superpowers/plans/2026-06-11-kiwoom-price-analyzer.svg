<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455A64"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="900" fill="#FFFFFF"/>

  <!-- 제목 -->
  <text x="650" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">Signal Alpha — 키움 주가 분석기(PRICE) 설계 구조</text>
  <text x="650" y="60" text-anchor="middle" font-size="12" fill="#78909C">feat/kiwoom-api-analyzer · 2026-06-11 · 계획 문서: docs/superpowers/plans/2026-06-11-kiwoom-price-analyzer.md</text>

  <!-- ───────── 수집 측 (왼쪽) ───────── -->
  <!-- 키움 REST API -->
  <rect x="40" y="80" width="300" height="80" rx="8" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.5"/>
  <text x="190" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#880E4F">키움증권 REST API</text>
  <text x="190" y="136" text-anchor="middle" font-size="11" fill="#AD1457">api.kiwoom.com — OAuth2 (appkey/secretkey)</text>

  <!-- price-collector -->
  <rect x="40" y="210" width="300" height="130" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="190" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">services/price-collector</text>
  <text x="190" y="260" text-anchor="middle" font-size="11" fill="#1565C0">배치 CLI · FastAPI 아님 · 엔드포인트 없음</text>
  <text x="190" y="280" text-anchor="middle" font-size="11" fill="#1565C0">kiwoom/rest_client.py 〔진행 중〕</text>
  <text x="190" y="300" text-anchor="middle" font-size="11" fill="#1565C0">REST 전환으로 Linux/Docker 실행 가능</text>
  <text x="190" y="320" text-anchor="middle" font-size="11" fill="#1565C0">pipeline.py — 정규화 · 업서트</text>

  <!-- collector → API (TR 호출, 위 방향) -->
  <line x1="190" y1="210" x2="190" y2="164" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="200" y="192" font-size="10" fill="#546E7A">TR 호출 (일봉 / 수급 / 기본정보)</text>

  <!-- collector → DB (쓰기) -->
  <line x1="190" y1="340" x2="190" y2="596" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="200" y="470" font-size="11" fill="#546E7A">쓰기: OHLCV · 수급 적재 (psycopg)</text>

  <!-- ───────── PostgreSQL (하단 중앙-좌) ───────── -->
  <rect x="40" y="600" width="360" height="180" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
  <text x="220" y="628" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">PostgreSQL (EC2 / 관리형)</text>
  <text x="60" y="656" font-size="12" fill="#5D4037">시세: ohlcv_data · sector_ohlcv · collector_runs</text>
  <text x="60" y="680" font-size="12" fill="#5D4037">분석: agent_results · final_signals</text>
  <text x="60" y="704" font-size="12" fill="#8D6E63">후속: backtest_results · score_history</text>
  <line x1="60" y1="718" x2="380" y2="718" stroke="#FFE082" stroke-width="1"/>
  <text x="60" y="740" font-size="11" font-style="italic" fill="#8D6E63">수집기와 분석기는 DB로만 연결 (직접 호출 없음)</text>

  <!-- ───────── agent-worker (오른쪽) ───────── -->
  <rect x="430" y="80" width="830" height="440" rx="10" fill="#F8FAFB" stroke="#607D8B" stroke-width="1.5"/>
  <text x="450" y="108" font-size="13" font-weight="bold" fill="#37474F">services/agent-worker (:8011 · FastAPI) — 분석 측</text>

