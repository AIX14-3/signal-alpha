  <rect x="290" y="845" width="14" height="14" rx="3" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="312" y="857" font-size="12" fill="#37474F">DB</text>
  <rect x="370" y="845" width="14" height="14" rx="3" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.5"/>
  <text x="392" y="857" font-size="12" fill="#37474F">외부 API</text>
  <rect x="480" y="845" width="14" height="14" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="502" y="857" font-size="12" fill="#37474F">합산/저장</text>
  <rect x="590" y="845" width="14" height="14" rx="3" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="612" y="857" font-size="12" fill="#37474F">후속 브랜치</text>
</svg>
