name: "🚀 Kick-off (작업 시작)"
description: "맡은 개발 부분을 시작할 때 여는 이슈. 이 이슈가 진행 추적의 앵커가 됩니다."
title: "[Kickoff] <영역>: <한 줄 목표>"
labels: ["kickoff"]
body:
  - type: markdown
    attributes:
      value: |
        ## 시작 전 체크 (중요)
        1. **이 이슈를 본인에게 Assignee 지정**하세요 → "작업을 시작한 사람"이 GitHub ID로 추적됩니다.
        2. GitHub Project에 추가되면 **Status를 `In Progress`** 로 옮기세요.
        3. 작업 PR에는 본문에 `Closes #이슈번호` 를 넣어 자동으로 `Done` 되게 하세요.
  - type: dropdown
    id: area
    attributes:
      label: 영역 (Area)
      description: 어떤 개발 부분인지 (담당자가 아니라 '무엇'을 분류)
      options:
        - dart
        - report
        - hiring
        - datalab
        - patent
        - price (kiwoom)
        - aggregator
        - web
        - db-infra
        - other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표 / 범위
      description: 이 작업으로 무엇을 끝낼 것인가 (스코프 in/out)
      placeholder: |
        - In: ...
        - Out(이번 범위 아님): ...
    validations:
      required: true
  - type: input
    id: design
    attributes:
      label: 설계 문서 / 스펙 링크
      description: 관련 docs/ 또는 PR/이슈 링크
      placeholder: "docs/spec/..., #PR번호"
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준 (Acceptance Criteria)
      description: 체크박스로. 전부 체크되면 Done.
      value: |
        - [ ]
        - [ ]
        - [ ] 테스트/검증 통과
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: 의존성
      description: 먼저 끝나야 하는 작업 (없으면 "없음")
      placeholder: "#이슈번호, 또는 없음"
  - type: input
    id: target_date
    attributes:
      label: 목표 완료일
      placeholder: "YYYY-MM-DD"
  - type: textarea
    id: deliverables
    attributes:
      label: 산출물
      description: 끝나면 남는 것 (PR/문서/엔드포인트 등)
