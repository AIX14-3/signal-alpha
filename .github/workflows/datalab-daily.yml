name: DataLab Daily

# 이 워크플로는 DataLab '키워드 생성'만 담당한다(하루 여러 번 — 뉴스는 실시간이라
# 신규 사건을 더 빨리 포착). 검색량 '수집'은 altdata-collect.yml(06:30 KST)로 이관했다.
#   - daily_keyword_pipeline.py — 뉴스/DART 사건 → 검증 관문(+스파이크) → 티어별 자동적재
#        (approved=즉시 active, pending=관리자 검수 대기, reject=드롭)  ← 매 스케줄마다 실행
#   - 생성된 is_active=TRUE 키워드를 altdata-collect.yml 이 다음 슬롯에 수집한다(누적이라 안전).
#
# 왜 분리했나: 예전엔 생성+수집이 한 잡(30분 타임아웃)에 묶여, 생성(종목별 Gemini 순차)이
# 30분을 넘기면 수집 스텝이 실행조차 안 됐다. 생성 단독으로 떼고 타임아웃을 60분으로 올렸다.
#
# 활성화 전제: 아래 Secrets를 리포지토리에 등록해야 한다.
#   DATABASE_URL, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, GEMINI_API_KEY
#   (선택) GEMINI_MODEL, COLLECTOR_VERSION
# 수동 실행(workflow_dispatch)도 키워드 생성만 수행한다.
#
# ⚠️ 2026-07-14 정기 스케줄 폐지 → GKE CronJob `datalab-keywords`(deploy/k8s)로 이전.
# 이유: ①이 워크플로의 대상 DB(Supabase)가 용량초과로 read-only 잠김(1.5GB>500MB)
#      ②prod 수집기(GKE altdata-collect)는 Cloud SQL 을 읽어, 여기서 만든 키워드가
#        prod 수집에 닿지 않는 이원 구조였음.
# workflow_dispatch 는 남겨둔다(Supabase 복구 시 수동 백필용).

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "단일 종목만 처리(비우면 전체 활성 종목)"
        required: false
        default: ""

concurrency:
  group: datalab-daily
  cancel-in-progress: false

jobs:
  datalab-daily:
    name: Generate + validate keywords
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      COLLECTOR_VERSION: ${{ secrets.COLLECTOR_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-packages --group dev

      - name: Generate + validate + auto-apply keywords
        working-directory: services/agent-worker
        run: uv run python daily_keyword_pipeline.py ${{ inputs.ticker && format('--ticker {0}', inputs.ticker) || '' }}

      # 수집(run_collectors.py --datalab-only)은 altdata-collect.yml 로 이관됨.

      - name: Upload keyword review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-reviews
          path: services/agent-worker/keyword_reviews/
          if-no-files-found: ignore
          retention-days: 14
