name: Branch Kick-off Tracker

# 작업용 브랜치를 만들면 자동으로 Kick-off 이슈를 열어 추적을 시작한다.
# (progress-tracking.md의 수동 Kick-off와 병행 — 둘 중 하나만 있으면 됨)
# 보드 적재는 Project의 빌트인 "auto-add" 워크플로가 새 이슈를 받아 처리한다.
on:
  create

permissions:
  issues: write
  contents: read

jobs:
  kickoff:
    # 태그 제외, 작업용 브랜치 접두사만 (노이즈 방지). default 브랜치는 create로 안 옴.
    if: >-
      github.event.ref_type == 'branch' &&
      (startsWith(github.event.ref, 'feat/') ||
       startsWith(github.event.ref, 'feature/') ||
       startsWith(github.event.ref, 'fix/') ||
       startsWith(github.event.ref, 'chore/') ||
       startsWith(github.event.ref, 'docs/') ||
       startsWith(github.event.ref, 'refactor/'))
    runs-on: ubuntu-latest
    steps:
      - name: Open kick-off issue for the new branch (idempotent)
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.ref;            // 생성된 브랜치명
            const actor = context.payload.sender.login;     // 브랜치 만든 사람
            const { owner, repo } = context.repo;
            const marker = `kickoff-branch:${branch}`;

            // 멱등: 같은 브랜치용 kickoff 이슈가 이미 있으면 skip
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:body "${marker}"`,
            });
            if (found.data.total_count > 0) {
              core.info(`already tracked: ${branch} (#${found.data.items[0].number})`);
              return;
            }

            // 브랜치명에서 area 추론 (존재하는 라벨만 부착)
            const known = ['dart','hiring','report','datalab','patent','price','aggregator','web'];
            const hit = known.find((a) => branch.toLowerCase().includes(a));
            const labels = ['kickoff', ...(hit ? [`area:${hit}`] : [])];

            const body = [
              `## 🚀 Kick-off (자동: 브랜치 \`${branch}\`)`,
              '',
              `시작한 사람: @${actor} — 브랜치 생성으로 추적 시작.`,
              '',
              '아래를 채워주세요(완료 추적의 앵커):',
              '- **목표/범위**:',
              '- **완료기준(DoD)**:',
              '- **설계문서**:',
              '- **의존성/목표완료일**:',
              '',
              `> 작업 PR 본문에 \`Closes #${'{이 이슈번호}'}\` 를 넣으면 머지 시 자동 Done.`,
              '',
              `<!-- ${marker} -->`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner, repo,
              title: `🚀 Kick-off: ${branch}`,
              body,
              labels,
            });

            // self-assign (실패해도 이슈 생성은 유지)
            try {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: issue.data.number, assignees: [actor],
              });
            } catch (e) {
              core.warning(`assign 실패(@${actor}): ${e.message}`);
            }
            core.info(`created kick-off #${issue.data.number} for ${branch}`);
