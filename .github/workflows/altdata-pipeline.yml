name: AltData Pipeline

# 대체데이터 파이프라인 1회 실행: 수집 → 정규화 → 분석 → final_signals 발행.
#
# 왜 필요한가: 워커(배포 시 GCE)는 큐를 자동으로 비우지 않는다(가격/ops 데몬만 상시).
# 또 run_analyzers.py 는 ANALYZE_{DATALAB,HIRING,PATENT} 만 드레인하므로, 수집이 쌓은 NORMALIZE_*
# 단계를 비워줄 드라이버가 없다. 이 워크플로가 Actions 러너에서 세 CLI 를 순서대로 돌려
# 큐를 끝까지 비운다. CLI 는 DB 에 직접 붙으므로 공개 워커가 필요 없다.
#   run_collectors.py  → raw_documents + NORMALIZE_* enqueue
#   run_normalizers.py → NORMALIZE_* 드레인 → source_documents/signal_events
#   run_analyzers.py   → ANALYZE_{DATALAB,HIRING,PATENT} enqueue+드레인 → final_signals(소스별 1행)
#
# 활성화 전제 — 리포지토리 Secrets(Settings > Secrets and variables > Actions):
#   DATABASE_URL                         (worker 롤 또는 owner)
#   NAVER_DATALAB_CLIENT_ID / _SECRET    (DataLab 수집)
#   HIRING_DATALAB_CLIENT_ID / _SECRET   (Hiring 기준선 — 별도 네이버 앱, 쿼터 분리)
#   GEMINI_API_KEY                       (DataLab 키워드 생성 등)
#   KIPRIS_API_KEY / GOOGLE_CLOUD_PROJECT(특허 수집 — BigQuery ADC 별도 설정 필요할 수 있음)
#   COLLECTOR_VERSION                    (선택)
#
# ⚠️ schedule 은 운영 DB 에 자동 적재한다(매일 06:30 KST). 활성 상태.
#    수동 검증이 필요하면 workflow_dispatch 로 ticker 1개만 지정해 먼저 돌려볼 것.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "단일 종목만 처리(비우면 전체 활성 종목)"
        required: false
        default: ""
  schedule:
    - cron: "30 21 * * *" # 06:30 KST — datalab-daily(06:00 수집) 직후 정규화+분석

concurrency:
  group: altdata-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Collect → Normalize → Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
      NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
      HIRING_DATALAB_CLIENT_ID: ${{ secrets.HIRING_DATALAB_CLIENT_ID }}
      HIRING_DATALAB_CLIENT_SECRET: ${{ secrets.HIRING_DATALAB_CLIENT_SECRET }}
      COLLECTOR_VERSION: ${{ secrets.COLLECTOR_VERSION }}
      # workflow_dispatch 입력 → CLI 인자(비우면 전체 종목)
      TICKER_ARG: ${{ inputs.ticker && format('--ticker {0}', inputs.ticker) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-packages --group dev

      # 수집은 외부 API 의존(특허=BigQuery/KIPRIS, DataLab=Naver). 일부 소스의 키가
      # 없거나 쿼터 소진(429)이어도 나머지 단계가 기존 데이터로 진행되도록 continue-on-error.
      - name: Collect — patent
        if: always()
        continue-on-error: true
        working-directory: services/agent-worker
        run: uv run python run_collectors.py --patent-only $TICKER_ARG

      - name: Collect — datalab
        if: always()
        continue-on-error: true
        working-directory: services/agent-worker
        run: uv run python run_collectors.py --datalab-only $TICKER_ARG

      # 정규화/분석은 DB 큐를 드레인하므로 항상 실행(수집이 일부 실패해도 기존 큐를 처리).
      - name: Normalize — drain NORMALIZE_* queue
        if: always()
        working-directory: services/agent-worker
        run: uv run python run_normalizers.py

      - name: Analyze — publish final_signals
        if: always()
        working-directory: services/agent-worker
        run: uv run python run_analyzers.py $TICKER_ARG
