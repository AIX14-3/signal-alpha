name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-packages --group dev

      - name: Ruff lint
        run: uv run ruff check .

      # DB 거버넌스: 모든 마이그/시드의 -- target: 태그 + target↔테이블·cross-DB FK 정합(#531).
      - name: DB target/locality lint
        run: uv run python database/tools/check_targets.py

      # worker/backend 의존성 분리 가드: main-server(backend)는 worker 전용 data-access
      # (signal_alpha_data_access.worker / .repositories)를 import 할 수 없다.
      # 반드시 signal_alpha_data_access.backend 읽기 계약 facade 만 사용한다.
      - name: Guard - backend must not import worker data-access
        run: |
          if grep -rEn "signal_alpha_data_access\.(worker|repositories)" services/main-server/app; then
            echo "::error::main-server는 worker data-access(.worker/.repositories)를 import할 수 없습니다. signal_alpha_data_access.backend 만 사용하세요."
            exit 1
          fi
          echo "OK: main-server는 signal_alpha_data_access.backend 만 사용합니다."

      # 워크스페이스 멤버는 각자 app 패키지를 PYTHONPATH 루트로 갖기 때문에
      # 루트 일괄 실행 시 모듈명이 충돌한다. AGENTS.md대로 패키지별로 실행한다.
      - name: Pytest - main-server
        run: uv run pytest
        working-directory: services/main-server

      - name: Pytest - agent-worker
        run: uv run pytest
        working-directory: services/agent-worker

      - name: Pytest - data-access
        run: uv run pytest
        working-directory: packages/data-access

      - name: Pytest - signal-core
        run: uv run pytest
        working-directory: packages/signal-core

      - name: Pytest - market-data
        run: uv run pytest
        working-directory: packages/market-data

      # database/ 는 워크스페이스 패키지가 아니라 루트에서 경로 지정으로 실행(모듈 충돌 없음).
      - name: Pytest - database
        run: uv run pytest database/tests

  web:
    name: Web typecheck, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify web
        run: npm run verify

  migrations:
    name: Migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16 + pgvector 선설치(공식 이미지). 20260701_1218 마이그의 CREATE EXTENSION vector 필요.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: signal_alpha
          POSTGRES_USER: signal_alpha
          POSTGRES_PASSWORD: signal_alpha_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal_alpha -d signal_alpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://signal_alpha:signal_alpha_password@localhost:5432/signal_alpha
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-packages --group dev

      - name: Apply migrations and seeds
        run: uv run python database/migrate.py apply --seeds

      # Report RAG(#709 report_chunks) 실 pgvector 통합 테스트 — $N::vector 캐스팅·<=> 코사인·
      # hnsw.ef_search·종목 스코프·ON CONFLICT 멱등을 실제 DB로 검증(fake 로는 못 잡음). opt-in
      # 게이트라 일반 python 잡에서는 skip 되고, DB 가 뜬 이 잡에서만 REPORT_RAG_DB_TEST=1 로 돈다.
      - name: Report RAG pgvector integration test
        working-directory: services/agent-worker
        env:
          REPORT_RAG_DB_TEST: "1"
          TEST_DATABASE_URL: postgresql://signal_alpha:signal_alpha_password@localhost:5432/signal_alpha
        run: uv run python -m pytest tests/test_report_rag_db.py -v

      - name: Show migration status
        run: uv run python database/migrate.py status

      # L2: schema.sql 스냅샷이 마이그 적용 결과와 일치하는지(재생성 누락 가드). 순서 무관 비교.
      #     schema.sql 생성과 동일한 PG16 이미지로 pg_dump(버전 라인 정합).
      - name: Schema snapshot drift (schema.sql)
        run: >
          uv run python database/tools/check_schema_snapshot.py
          --pg-dump "docker run --rm --network=host pgvector/pgvector:pg16 pg_dump"

      # L3: 2-DB 물리 분리 스모크 — collection/backend 각각 적용 성공 + 상대 DB 테이블 누수 0.
      #     target 과 실제 대상 DB 불일치(H1 류) 회귀를 차단.
      - name: 2-DB split smoke (collection/backend)
        run: uv run python database/tools/ci_2db_smoke.py
